name: Bug report
description: Report a bug or unexpected behaviour
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.
        **Never include passwords or credentials in bug reports.**

  - type: input
    id: version
    attributes:
      label: RecordRelay version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - CLI
        - Desktop app
        - IntelliJ plugin
        - Connector — PostgreSQL
        - Connector — MongoDB
        - Connector — MySQL/MariaDB
        - Connector — SQL Server
        - Connector — Oracle
        - Connector — SQLite
        - Connector — Cassandra
        - Connector — Redis
        - Connector — Elasticsearch
        - Connector — File (CSV/Excel/JSON/YAML/Parquet)
        - Core / Engine
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `rr-cli migrate --source ...`
        2. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output. Remove sensitive data.
      render: text

  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "e.g. OpenJDK 21.0.3"
