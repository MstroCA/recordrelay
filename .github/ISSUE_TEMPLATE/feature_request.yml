name: Feature request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the feature and its motivation.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've tried.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New connector
        - Performance improvement
        - CLI / UX
        - Desktop app
        - IntelliJ plugin
        - Mapping DSL
        - Security
        - Documentation
        - Other
    validations:
      required: true
