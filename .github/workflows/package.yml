name: Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.2.3 — leave blank to use project default)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  package-desktop:
    name: Package Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pkg_type: dmg
            pkg_ext: dmg
          - os: windows-latest
            pkg_type: exe
            pkg_ext: exe
          - os: ubuntu-latest
            pkg_type: deb
            pkg_ext: deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(./gradlew -q properties | grep "^version:" | awk '{print $2}')
          fi
          APP_VERSION="${VERSION//-SNAPSHOT/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Build installDist
        run: ./gradlew :recordrelay-desktop:installDist -Pversion=${{ steps.ver.outputs.VERSION }}

      - name: Install deb tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          MAIN_JAR=$(find recordrelay-desktop/build/install/recordrelay-desktop/lib -maxdepth 1 -name "recordrelay-desktop-*.jar" | head -1 | xargs basename)
          jpackage \
            --type dmg \
            --name "RecordRelay" \
            --app-version "${{ steps.ver.outputs.APP_VERSION }}" \
            --input recordrelay-desktop/build/install/recordrelay-desktop/lib \
            --main-jar "$MAIN_JAR" \
            --main-class io.recordrelay.desktop.RecordRelayApp \
            --java-options "-Xmx512m" \
            --dest recordrelay-desktop/build/packages

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          MAIN_JAR=$(find recordrelay-desktop/build/install/recordrelay-desktop/lib -maxdepth 1 -name "recordrelay-desktop-*.jar" | head -1 | xargs basename)
          jpackage \
            --type exe \
            --name "RecordRelay" \
            --app-version "${{ steps.ver.outputs.APP_VERSION }}" \
            --input recordrelay-desktop/build/install/recordrelay-desktop/lib \
            --main-jar "$MAIN_JAR" \
            --main-class io.recordrelay.desktop.RecordRelayApp \
            --java-options "-Xmx512m" \
            --win-dir-chooser \
            --win-shortcut \
            --dest recordrelay-desktop/build/packages

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          MAIN_JAR=$(find recordrelay-desktop/build/install/recordrelay-desktop/lib -maxdepth 1 -name "recordrelay-desktop-*.jar" | head -1 | xargs basename)
          jpackage \
            --type deb \
            --name "recordrelay" \
            --app-version "${{ steps.ver.outputs.APP_VERSION }}" \
            --input recordrelay-desktop/build/install/recordrelay-desktop/lib \
            --main-jar "$MAIN_JAR" \
            --main-class io.recordrelay.desktop.RecordRelayApp \
            --java-options "-Xmx512m" \
            --linux-shortcut \
            --dest recordrelay-desktop/build/packages

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ steps.ver.outputs.VERSION }}
          path: recordrelay-desktop/build/packages/*.${{ matrix.pkg_ext }}
          retention-days: 7

  package-cli:
    name: Package CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(./gradlew -q properties | grep "^version:" | awk '{print $2}')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build fat JAR
        run: ./gradlew :recordrelay-cli:shadowJar -Pversion=${{ steps.ver.outputs.VERSION }}

      - name: Create archive
        run: |
          DIST="rr-cli-${{ steps.ver.outputs.VERSION }}"
          mkdir -p "$DIST/bin" "$DIST/lib"
          cp recordrelay-cli/build/libs/rr-cli-${{ steps.ver.outputs.VERSION }}.jar "$DIST/lib/"
          printf '#!/usr/bin/env bash\nDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"\nexec java -jar "$DIR/lib/rr-cli-${{ steps.ver.outputs.VERSION }}.jar" "$@"\n' \
            > "$DIST/bin/rr"
          chmod +x "$DIST/bin/rr"
          printf '@echo off\nset DIR=%%~dp0..\njava -jar "%%DIR%%\\lib\\rr-cli-${{ steps.ver.outputs.VERSION }}.jar" %%*\n' \
            > "$DIST/bin/rr.cmd"
          tar -czf "$DIST.tar.gz" "$DIST/"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ steps.ver.outputs.VERSION }}
          path: rr-cli-${{ steps.ver.outputs.VERSION }}.tar.gz
          retention-days: 7

  package-plugin:
    name: Package Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(./gradlew -q properties | grep "^version:" | awk '{print $2}')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build plugin
        run: ./gradlew :recordrelay-plugin:buildPlugin -Pversion=${{ steps.ver.outputs.VERSION }}

      - name: Sign plugin
        if: env.CERTIFICATE_CHAIN != ''
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew :recordrelay-plugin:signPlugin -Pversion=${{ steps.ver.outputs.VERSION }}

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ steps.ver.outputs.VERSION }}
          path: |
            recordrelay-plugin/build/distributions/*.zip
            recordrelay-plugin/build/distributions/*.sig
          retention-days: 7
