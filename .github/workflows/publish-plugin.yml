name: Publish Plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    if: vars.PUBLISH_PLUGIN == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version
        id: ver
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        shell: bash
        run: ./gradlew :recordrelay-plugin:buildPlugin "-Pversion=${{ steps.ver.outputs.VERSION }}"

      - name: Sign plugin
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew :recordrelay-plugin:signPlugin "-Pversion=${{ steps.ver.outputs.VERSION }}"

      - name: Publish plugin
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew :recordrelay-plugin:publishPlugin "-Pversion=${{ steps.ver.outputs.VERSION }}"
