name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Spotless check
        shell: bash
        run: ./gradlew spotlessCheck

      - name: Checkstyle
        shell: bash
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Compile & test
        shell: bash
        run: ./gradlew compileJava test

  package-desktop:
    name: Package Desktop (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pkg_type: dmg
            pkg_ext: dmg
          - os: windows-latest
            pkg_type: exe
            pkg_ext: exe
          - os: ubuntu-latest
            pkg_type: deb
            pkg_ext: deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version
        id: ver
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build installDist
        shell: bash
        run: ./gradlew :recordrelay-desktop:installDist "-PreleaseVersion=${{ steps.ver.outputs.VERSION }}"

      - name: Install deb tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot

      - name: Build custom runtime (jlink + JavaFX)
        shell: bash
        run: |
          LIB="recordrelay-desktop/build/install/recordrelay-desktop/lib"
          JAVAFX_MODS="recordrelay-desktop/build/javafx-mods"
          mkdir -p "${JAVAFX_MODS}"
          find "${LIB}" -maxdepth 1 -name "javafx-*.jar" -exec cp {} "${JAVAFX_MODS}/" \;
          MODS="java.base,java.compiler,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.sql,java.sql.rowset,java.transaction.xa,java.xml,jdk.crypto.ec,jdk.jfr,jdk.management,jdk.unsupported,jdk.unsupported.desktop,javafx.controls,javafx.fxml,javafx.base,javafx.graphics"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            JMODS=$(cygpath -m "${JAVA_HOME}/jmods")
            JAVAFX_ABS=$(cygpath -m "$(pwd)/${JAVAFX_MODS}")
            MP="${JMODS};${JAVAFX_ABS}"
          else
            MP="${JAVA_HOME}/jmods:${JAVAFX_MODS}"
          fi
          jlink \
            --module-path "${MP}" \
            --add-modules "${MODS}" \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --output recordrelay-desktop/build/custom-runtime

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          LIB="recordrelay-desktop/build/install/recordrelay-desktop/lib"
          MAIN_JAR=$(find "${LIB}" -maxdepth 1 -name "recordrelay-desktop-*.jar" | head -1 | xargs basename)
          jpackage \
            --type dmg \
            --name "RecordRelay" \
            --app-version "${{ steps.ver.outputs.VERSION }}" \
            --runtime-image recordrelay-desktop/build/custom-runtime \
            --input "${LIB}" \
            --main-jar "$MAIN_JAR" \
            --main-class io.recordrelay.desktop.RecordRelayApp \
            --java-options "-Xmx512m" \
            --java-options "--add-modules javafx.controls,javafx.fxml,javafx.base,javafx.graphics" \
            --dest recordrelay-desktop/build/packages

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          LIB="recordrelay-desktop/build/install/recordrelay-desktop/lib"
          MAIN_JAR=$(find "${LIB}" -maxdepth 1 -name "recordrelay-desktop-*.jar" | head -1 | xargs basename)
          jpackage \
            --type exe \
            --name "RecordRelay" \
            --app-version "${{ steps.ver.outputs.VERSION }}" \
            --runtime-image recordrelay-desktop/build/custom-runtime \
            --input "${LIB}" \
            --main-jar "$MAIN_JAR" \
            --main-class io.recordrelay.desktop.RecordRelayApp \
            --java-options "-Xmx512m" \
            --java-options "--add-modules javafx.controls,javafx.fxml,javafx.base,javafx.graphics" \
            --win-dir-chooser \
            --win-shortcut \
            --dest recordrelay-desktop/build/packages

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LIB="recordrelay-desktop/build/install/recordrelay-desktop/lib"
          MAIN_JAR=$(find "${LIB}" -maxdepth 1 -name "recordrelay-desktop-*.jar" | head -1 | xargs basename)
          jpackage \
            --type deb \
            --name "recordrelay" \
            --app-version "${{ steps.ver.outputs.VERSION }}" \
            --runtime-image recordrelay-desktop/build/custom-runtime \
            --input "${LIB}" \
            --main-jar "$MAIN_JAR" \
            --main-class io.recordrelay.desktop.RecordRelayApp \
            --java-options "-Xmx512m" \
            --java-options "--add-modules javafx.controls,javafx.fxml,javafx.base,javafx.graphics" \
            --linux-shortcut \
            --dest recordrelay-desktop/build/packages

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: recordrelay-desktop/build/packages/*.${{ matrix.pkg_ext }}
          retention-days: 1

  package-cli:
    name: Package CLI
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version
        id: ver
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build fat JAR
        shell: bash
        run: ./gradlew :recordrelay-cli:shadowJar "-PreleaseVersion=${{ steps.ver.outputs.VERSION }}"

      - name: Create archive
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          DIST="rr-cli-${VER}"
          JAR=$(find recordrelay-cli/build/libs -maxdepth 1 -name "rr-cli-*.jar" | head -1)
          mkdir -p "${DIST}/bin" "${DIST}/lib"
          cp "${JAR}" "${DIST}/lib/rr-cli-${VER}.jar"
          printf '#!/usr/bin/env bash\nDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"\nexec java -jar "$DIR/lib/rr-cli-%s.jar" "$@"\n' "${VER}" \
            > "${DIST}/bin/rr"
          chmod +x "${DIST}/bin/rr"
          printf '@echo off\nset DIR=%%~dp0..\njava -jar "%%DIR%%\\lib\\rr-cli-%s.jar" %%*\n' "${VER}" \
            > "${DIST}/bin/rr.cmd"
          tar -czf "${DIST}.tar.gz" "${DIST}/"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: rr-cli-${{ steps.ver.outputs.VERSION }}.tar.gz
          retention-days: 1

  package-plugin:
    name: Package Plugin
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version
        id: ver
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        shell: bash
        run: ./gradlew :recordrelay-plugin:buildPlugin "-PreleaseVersion=${{ steps.ver.outputs.VERSION }}"

      - name: Sign plugin
        if: env.CERTIFICATE_CHAIN != ''
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew :recordrelay-plugin:signPlugin "-PreleaseVersion=${{ steps.ver.outputs.VERSION }}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            recordrelay-plugin/build/distributions/*.zip
            recordrelay-plugin/build/distributions/*.sig
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [package-desktop, package-cli, package-plugin]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/desktop-macos-latest/*.dmg
            release-artifacts/desktop-windows-latest/*.exe
            release-artifacts/desktop-ubuntu-latest/*.deb
            release-artifacts/cli/*.tar.gz
            release-artifacts/plugin/*.zip
            release-artifacts/plugin/*.sig
