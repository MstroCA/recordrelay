version: "3.9"

services:
  postgres1:
    image: postgres:16
    container_name: postgres1
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: company
    ports:
      - "5432:5432"
    volumes:
      - pg1_data:/var/lib/postgresql/data
      - ./postgres1-init.sql:/docker-entrypoint-initdb.d/init.sql

  postgres2:
    image: postgres:16
    container_name: postgres2
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - pg2_data:/var/lib/postgresql/data
      - ./postgres2-init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pg1_data:
  pg2_data:
