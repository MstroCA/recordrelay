[versions]
java = "21"

# Build plugins
spotless = "6.25.0"
checkstyle = "10.18.1"
spotbugs-plugin = "6.0.9"
jacoco = "0.8.12"

# Core dependencies
slf4j = "2.0.13"
logback = "1.5.6"

# Connectors
postgresql = "42.7.3"
mongodb-driver = "5.1.1"
hikaricp = "5.1.0"

# New SQL connectors
mysql-connector = "9.1.0"
mssql-jdbc = "12.8.1.jre11"
oracle-jdbc = "23.6.0.24.10"
sqlite-jdbc = "3.47.1.0"

# New NoSQL connectors
cassandra-driver = "4.17.0"
lettuce = "6.4.1.RELEASE"
elasticsearch-java = "8.17.0"

# File connectors
commons-csv = "1.12.0"
poi-ooxml = "5.3.0"
parquet-avro = "1.14.3"
hadoop-common = "3.5.0"
jakarta-json = "2.1.3"

# CLI
picocli = "4.7.6"

# Desktop
javafx = "21.0.4"

# Testing
junit5 = "5.10.3"
mockito = "5.12.0"
assertj = "3.26.0"
testcontainers = "1.20.1"

# Engine
spring-batch = "5.1.2"
spring-framework = "6.1.14"
h2 = "2.3.232"

# Mapping parsers
jackson = "2.17.2"
snakeyaml = "2.3"
jsqlparser = "4.9"

# Desktop UI
atlantafx = "2.0.1"
testfx = "4.0.18"

# IntelliJ Platform plugin
intellij-platform = "2.1.0"

# CLI packaging
shadow = "8.1.1"

# Annotation processing
spotbugs-annotations = "4.8.6"

[libraries]
# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Connectors
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb-driver" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }

# New SQL connector drivers
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql-jdbc" }
oracle-jdbc = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "oracle-jdbc" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

# New NoSQL connector drivers
cassandra-driver-core = { module = "com.datastax.oss:java-driver-core", version.ref = "cassandra-driver" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
elasticsearch-java = { module = "co.elastic.clients:elasticsearch-java", version.ref = "elasticsearch-java" }
jakarta-json-api = { module = "jakarta.json:jakarta.json-api", version.ref = "jakarta-json" }

# File connector libraries
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commons-csv" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi-ooxml" }
parquet-avro = { module = "org.apache.parquet:parquet-avro", version.ref = "parquet-avro" }
hadoop-common = { module = "org.apache.hadoop:hadoop-common", version.ref = "hadoop-common" }
hadoop-mapreduce-client-core = { module = "org.apache.hadoop:hadoop-mapreduce-client-core", version.ref = "hadoop-common" }

# CLI
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit5 = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit5 = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-mongodb = { module = "org.testcontainers:mongodb", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }
testcontainers-mssqlserver = { module = "org.testcontainers:mssqlserver", version.ref = "testcontainers" }
testcontainers-oracle = { module = "org.testcontainers:oracle-xe", version.ref = "testcontainers" }
testcontainers-cassandra = { module = "org.testcontainers:cassandra", version.ref = "testcontainers" }
testcontainers-elasticsearch = { module = "org.testcontainers:elasticsearch", version.ref = "testcontainers" }

# Engine
spring-batch-core = { module = "org.springframework.batch:spring-batch-core", version.ref = "spring-batch" }
spring-jdbc = { module = "org.springframework:spring-jdbc", version.ref = "spring-framework" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# Mapping parsers
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
jsqlparser = { module = "com.github.jsqlparser:jsqlparser", version.ref = "jsqlparser" }

# Desktop UI
atlantafx-base = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }
testfx-core = { module = "org.testfx:testfx-core", version.ref = "testfx" }
testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }

# Static analysis
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-annotations" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
