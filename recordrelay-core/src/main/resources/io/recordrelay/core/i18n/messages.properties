# Help topic bodies — use \n for line breaks, # for heading, ## for subheading, • for bullet
help.topic.getting-started.body=# Getting Started\n\nRecordRelay copies a single database record — and every related record — from one database to another. It is not an ETL tool. Think of it as a way to reproduce a specific customer, order, or case from production into your local or test environment in minutes.\n\n## Add your connections first\n\nOpen Connections from the sidebar. Click Add… and fill in the host, port, database name and credentials for each database you need access to (for example: prod-db and local-db).\n\n## Create environments (optional)\n\nEnvironments are named groups like “prod”, “staging”, “local”. Open Environments and click Add… to create them. This is optional but makes the connection dropdowns easier to read.\n\n## Clone your first record\n\nOpen Clone Context from the sidebar (the blue button at the top). Follow the four steps:\n• Step 1: choose a source and a target connection\n• Step 2: select the root table and enter the record ID\n• Step 3: set depth (3 is a good starting point) and leave conflict resolution on the default\n• Step 4: optionally override field values in the target\n\nClick Clone Context and watch the log.

help.topic.clone-context.body=# Clone Context\n\nThe main screen. Copies one record and all connected records from a source database to a target database.\n\n## Step 1 — Select connections\n\nSource: the database to read from (e.g. production).\nTarget: the database to write to (e.g. local).\n\nExport mode checkbox: instead of writing to the target, saves everything to a .rrpkg file you can share with colleagues.\n\n## Step 2 — Table & Record\n\nRoot Table: the table where your record lives (e.g. orders, customers, beyanname). The dropdown is populated automatically when you choose a source connection.\n\nDetect button: analyzes foreign-key relationships to suggest the most likely root tables.\n\nPrimary Key Column: the column that uniquely identifies each row (almost always id).\n\nRecord ID: the value in the PK column for the record you want to clone (e.g. 12345).\n\n## Step 3 — Options\n\nRelationship depth: how many levels of related tables to follow. Depth 1 = only the root record. Depth 2 = root + its direct children. Depth 3 = root + children + grandchildren. Start with 3.\n\nMask PII: replaces email addresses, phone numbers, addresses, IBANs, and national IDs with realistic fake values. Masking is deterministic — the same source value always produces the same masked output.\n\nOn conflict: what to do when the target already has data. See the Conflict Resolution topic for a full explanation.\n\n## Step 4 — Field Overrides\n\nLet you change specific column values during the clone. Example: set created_by to a test user account so the cloned records do not appear to belong to a real user. Leave the Table column empty to apply the override to every table.\n\n## Preview button\n\nRuns a dry run without writing anything. Shows you which tables and how many rows would be copied. Use this before cloning to verify the scope.

help.topic.conflict-resolution.body=# Conflict Resolution\n\nWhen RecordRelay writes records into a target that already contains data, it needs a strategy for handling clashes. The On conflict combobox in Step 3 of Clone Context lets you choose one of four options.\n\n## Regenerate Identities (default — recommended)\n\nAssigns brand-new primary keys to every cloned record and updates all foreign keys to match. After writing, database sequences are advanced so that future inserts by the application will never collide with the cloned records.\n\nWhen to use: almost always. This is the safest option and works regardless of whether the target is empty or already has data.\n\n## Isolate Namespace\n\nOffsets all IDs into a separate numeric range so that multiple cloned contexts can coexist in the same target schema without interfering with each other or with pre-existing data.\n\nWhen to use: when several team members need separate test datasets in the same shared development database at the same time.\n\n## Fail Safe\n\nAborts before writing a single row if any affected table in the target already has records. Nothing is written when a conflict is detected.\n\nWhen to use: automated test pipelines or initial environment setup scripts where you want a hard guarantee that no old data can silently mix with the clone.\n\n## Skip Existing\n\nSilently skips any record whose primary key already exists in the target. Existing records are NOT updated.\nOn PostgreSQL this translates to ON CONFLICT DO NOTHING; on MySQL to INSERT IGNORE; on SQLite to INSERT OR IGNORE.\n\nWhen to use: refreshing a previously cloned dataset. For example, you cloned a customer yesterday, new orders have been placed since then, and you only want to add the missing records without touching what is already in the target.

help.topic.environments.body=# Environments\n\nEnvironments are named logical groups for your database connections. Examples: prod, staging, local, ci.\n\nYou do not need environments to use RecordRelay — they are optional. But they make the connection dropdowns easier to read when you have many connections.\n\n## How to create one\n\nOpen Environments from the sidebar. Click Add…, give it a name (e.g. local) and an optional description, then click OK.\n\nConnections are assigned to environments from the Connections screen.

help.topic.connections.body=# Connections\n\nA connection is a set of credentials and network settings that tells RecordRelay how to reach a database. You must add at least two connections (source and target) before you can clone.\n\n## Adding a connection\n\nClick Add…. Fill in:\n• Name: a short label you will see in dropdowns (e.g. prod-katv, local-dev)\n• Type: the database engine (PostgreSQL, MySQL, etc.)\n• Host, Port, Database: network address and database name\n• User and Password: credentials\n\n## Testing a connection\n\nSelect a row and click Test Connection. RecordRelay opens a brief connection and reports latency or the error reason.

help.topic.discovery.body=# Discovery\n\nLets you browse the table and column structure of any connected database without writing any queries.\n\n## How to use it\n\n• Select a connection from the dropdown\n• Select a database\n• Select a table\n• Click Inspect Columns\n\nThe right panel shows all columns: name, data type, whether NULLs are allowed, and whether the column is a primary key.\n\nUseful when you are figuring out the root table name or primary key column before running a clone.

help.topic.monitor.body=# Monitor / Dashboard\n\nShows what happened during the current application session.\n\n## Clone history\n\nEach row represents one clone operation: the table, record ID, source, target, number of records transferred, duration, and result (success or failed).\n\n## KPI cards\n\nAt the top you see summary counters: total records transferred, number of operations, failed operations, and the last operation’s duration.\n\n## Connection health\n\nThe lower panel lets you ping all configured connections to check latency and reachability. Click Check Health to run the test.\n\nNote: the history is only kept for the current session. It resets when you restart the application.

help.topic.graph-view.body=# Graph View\n\nVisualises the foreign-key relationships between tables in your database as an ERD-style diagram.\n\n## How to use it\n\n• Select a connection\n• Pick a root table from the dropdown\n• Click Discover\n\nThe diagram draws the selected table at the centre with lines to every table it relates to, and lines from those tables to their relations.\n\n## Navigation\n\n• Hover over a node: dims unrelated edges so you can follow one relationship at a time\n• Zoom: use the slider, +/− buttons, or Ctrl+Scroll\n• Fit to Screen: resets zoom and centres the graph\n\n## Edge types\n\nSolid curves = confirmed foreign-key constraints in the database schema.\nDashed curves = heuristic links detected by column naming patterns (e.g. a column named order_id pointing to an orders table).

help.topic.migration-drift.body=# Migration Drift\n\nCompares the schema (table and column structure) of two databases and reports differences. Useful for catching missing migrations.\n\n## How to use it\n\n• Select a source connection and database\n• Select a target connection and database\n• Click Analyze\n\nThe results table shows each difference with a colour-coded type:\n• Missing Table (red): table exists in source but not in target\n• Extra Table (yellow): table exists in target but not in source\n• Missing Column (red): column exists in source table but not in target table\n• Extra Column (yellow): column exists in target but not in source\n• Type Mismatch (blue): column exists in both but with a different data type\n\n## SQL Patch Script\n\nThe Generate SQL button produces an ALTER TABLE / CREATE TABLE script you can run on the target to bring it in line with the source. Statements that cannot be auto-generated safely are commented out.

help.topic.row-count-diff.body=# Row Count Diff\n\nCompares the number of rows in each table across two databases. A quick way to spot data divergence without inspecting individual records.\n\n## Reading the results\n\n• In sync: both databases have the same row count for this table\n• Target behind: target has fewer rows than source\n• Target ahead: target has more rows than source\n\nThe Diff column shows the exact difference (positive = target has more, negative = target has less).

help.topic.query-analyzer.body=# Query Analyzer\n\nLet you query any connected database and see results. Two modes:\n\n## Flow mode (default)\n\nA visual query builder. Double-click a table in the left panel to add it to the canvas. Click the port button (○) on a column to start a JOIN, then click a port on another table to complete it. A dialog asks for INNER, LEFT, or RIGHT. Check columns to include them in SELECT. Add WHERE filters, ORDER BY, and LIMIT in the right panel. The SQL preview updates live. Click Run to execute.\n\n## SQL mode\n\nA plain text editor for hand-written queries. Switch between modes with the toolbar button. Both modes share the same Run button and results table.

help.topic.connection-health.body=# Connection Health\n\nPings all your saved connections and reports:\n• Status: OK, Degraded, or Down\n• Latency: round-trip time in milliseconds\n• Detail: the error message if the connection failed\n\nClick Test All to run the check. This is useful before starting a clone to confirm both source and target are reachable.

help.topic.masking-coverage.body=# Masking Coverage\n\nScans your schema for columns that look like they contain PII (Personally Identifiable Information) and shows which ones are covered by masking rules.\n\n## Column categories detected\n\n• EMAIL: email address columns\n• PHONE: phone number columns\n• ADDRESS: address-related columns\n• IBAN: bank account number columns\n• NATIONAL_ID: national identity number columns (TC kimlik, SSN, etc.)\n\n## Reading the results\n\nGreen = the column will be masked when you clone with Mask PII enabled.\nRed (exposed) = the column looks like PII but is not covered by a masking rule.\n\nUse the Show exposed only checkbox to filter down to just the columns that need attention.

help.topic.presets.body=# Clone Presets\n\nSave frequently-used clone configurations so you can run them with one click instead of re-entering all settings every time.\n\n## Saving a preset\n\nFill in the form at the bottom of the screen: give the preset a name, choose source/target connections, enter entity name and ID, set depth, and optionally configure field overrides. Click Save Preset.\n\n## Running a preset\n\nSelect a saved preset from the list and click Run Now. The log panel shows progress.

help.topic.scheduled-sync.body=# Scheduled Sync\n\nDefines recurring clone jobs that run automatically on a schedule or can be triggered manually.\n\n## Setting up a sync\n\nFill in the name, entity, connections, and depth as with a preset. Then set a schedule:\n• Cron expression: standard 5-field cron (e.g. 0 6 * * 1 for every Monday at 06:00)\n• Interval (minutes): run every N minutes\n\nLeave both blank for a manual-only sync.\n\n## Running manually\n\nSelect a sync from the list and click Run Now at any time regardless of the schedule.

help.topic.faq.body=# Frequently Asked Questions\n\n## What is depth and how do I choose it?\n\nDepth controls how many levels of related tables are followed. Depth 1 = only the root record. Depth 2 = root + direct children. Depth 3 = root + children + grandchildren. Start with 3. If the clone takes too long or copies too much data, reduce it. If you are missing related records, increase it.\n\n## What happens to primary keys in the target?\n\nWith the default Regenerate Identities strategy, every cloned record gets a new primary key and all foreign keys are updated to match. The original IDs from the source are not used. Sequences are advanced to prevent future collisions.\n\n## Can I clone without overwriting existing data?\n\nYes. Set On conflict to Skip Existing. Records whose primary key already exists in the target are skipped silently.\n\n## What is a .rrpkg file?\n\nA portable package file (a ZIP archive) containing all the cloned records. Enable Export mode in Clone Context to create one instead of writing to a live database. Share the file with a colleague who can import it with rr import on the CLI.\n\n## Does masking change the source data?\n\nNo. Masking only affects the data written to the target (or the .rrpkg file). The source database is never modified.\n\n## Why did my clone fail with a type cast error?\n\nThis usually happens with PostgreSQL enum columns. It means the target database has a column defined as a custom enum type. RecordRelay handles this automatically from version 1.0.22 onwards.\n\n## Can I clone across different database engines?\n\nYes, as long as the schemas are compatible. For example, you can clone from PostgreSQL to MySQL. Column type differences are resolved at the driver level.\n\n## How do I clone from the command line?\n\nInstall the CLI and run: rr clone --entity orders --id 99 --from prod --target local --depth 3\nSee the CLI Reference in the docs folder for all available options.
