help.topic.getting-started.body=# البدء\n\nيقوم RecordRelay بنسخ سجل قاعدة بيانات واحد - وكل سجل مرتبط به - من قاعدة بيانات إلى أخرى. إنه ليس أداة ETL. فكّر فيه كطريقة لإعادة إنتاج عميل أو طلب أو حالة محددة من الإنتاج إلى بيئتك المحلية في غضون دقائق.\n\n## أضف اتصالاتك أولاً\n\nافتح الاتصالات من الشريط الجانبي. انقر على إضافة... وأدخل المضيف والمنفذ واسم قاعدة البيانات وبيانات الاعتماد.\n\n## إنشاء بيئات (اختياري)\n\nالبيئات هي مجموعات مسماة مثل "prod" و"staging" و"local". افتح البيئات وانقر على إضافة... لإنشائها.\n\n## نسخ سجلك الأول\n\nافتح Clone Context من الشريط الجانبي. اتبع الخطوات الأربع:\n• الخطوة 1: اختر اتصال المصدر والهدف\n• الخطوة 2: حدد الجدول الجذر وأدخل معرف السجل\n• الخطوة 3: حدد العمق (3 نقطة بداية جيدة)\n• الخطوة 4: تجاوز قيم الحقول اختيارياً\n\nانقر على نسخ السياق وراقب السجل.
help.topic.clone-context.body=# سياق النسخ\n\nالشاشة الرئيسية. تنسخ سجلاً واحداً وجميع السجلات المتصلة من قاعدة بيانات المصدر إلى قاعدة بيانات الهدف.\n\n## الخطوة 1 — تحديد الاتصالات\n\nالمصدر: قاعدة البيانات للقراءة منها.\nالهدف: قاعدة البيانات للكتابة إليها.\n\n## الخطوة 2 — الجدول والسجل\n\nالجدول الجذر: الجدول الذي يوجد فيه سجلك. زر الكشف: يحلل علاقات FK لاقتراح الجداول الجذر الأكثر احتمالاً.\n\n## الخطوة 3 — الخيارات\n\nعمق العلاقة: عدد مستويات الجداول ذات الصلة للمتابعة. ابدأ بـ 3.\nإخفاء البيانات الشخصية: يستبدل البيانات الشخصية بقيم مزيفة واقعية.\nعند التعارض: ما يجب فعله عندما يحتوي الهدف بالفعل على بيانات.\n\n## الخطوة 4 — تجاوزات الحقول\n\nيسمح بتغيير قيم أعمدة محددة أثناء النسخ.\n\n## زر المعاينة\n\nتشغيل تجريبي دون كتابة أي شيء. يعرض الجداول وعدد الصفوف التي ستُنسخ.
help.topic.conflict-resolution.body=# حل التعارضات\n\nعندما يكتب RecordRelay في هدف يحتوي بالفعل على بيانات، يحتاج إلى استراتيجية. يوفر "عند التعارض" أربعة خيارات.\n\n## إعادة توليد المعرّفات (افتراضي — موصى به)\n\nتعيين مفاتيح أساسية جديدة لكل سجل منسوخ وتحديث جميع المفاتيح الخارجية.\n\nمتى تستخدمه: دائماً تقريباً.\n\n## عزل مساحة الاسم\n\nإزاحة جميع المعرفات إلى نطاق رقمي منفصل.\n\n## الفشل الآمن\n\nإلغاء العملية قبل كتابة أي صف إذا كان أي جدول متأثر يحتوي بالفعل على سجلات.\n\n## تخطي الموجودة\n\nتخطي السجلات التي مفاتيحها الأساسية موجودة بالفعل في الهدف بصمت.\nPostgreSQL: ON CONFLICT DO NOTHING؛ MySQL: INSERT IGNORE؛ SQLite: INSERT OR IGNORE.
help.topic.environments.body=# البيئات\n\nالبيئات هي مجموعات منطقية مسماة لاتصالات قاعدة البيانات. أمثلة: prod وstaging وlocal وci.\n\nلست بحاجة إلى بيئات لاستخدام RecordRelay — إنها اختيارية.\n\n## كيفية إنشاء واحدة\n\nافتح البيئات من الشريط الجانبي. انقر على إضافة...، أعطها اسماً ووصفاً اختيارياً، ثم انقر موافق.
help.topic.connections.body=# الاتصالات\n\nالاتصال هو مجموعة من بيانات الاعتماد وإعدادات الشبكة. تحتاج إلى اتصالين على الأقل للنسخ.\n\n## إضافة اتصال\n\nانقر على إضافة.... أدخل:\n• الاسم: تسمية قصيرة\n• النوع: محرك قاعدة البيانات\n• المضيف والمنفذ وقاعدة البيانات\n• المستخدم وكلمة المرور\n\n## اختبار اتصال\n\nحدد صفاً وانقر على اختبار الاتصال.
help.topic.discovery.body=# الاكتشاف\n\nيتيح تصفح بنية الجداول والأعمدة لأي قاعدة بيانات متصلة دون كتابة استعلامات.\n\n## كيفية استخدامه\n\n• حدد اتصالاً من القائمة المنسدلة\n• حدد قاعدة بيانات\n• حدد جدولاً\n• انقر على فحص الأعمدة\n\nيعرض اللوحة اليمنى جميع الأعمدة مع الاسم والنوع وما إذا كانت NULL مسموحة وما إذا كان العمود مفتاحاً أساسياً.
help.topic.monitor.body=# الشاشة / لوحة التحكم\n\nتعرض ما حدث خلال جلسة التطبيق الحالية.\n\n## سجل النسخ\n\nكل صف يمثل عملية نسخ واحدة مع الجدول والمعرف والمصدر والهدف والسجلات والمدة والنتيجة.\n\n## بطاقات KPI\n\nيُعرض ملخص العدادات في الأعلى.\n\n## صحة الاتصالات\n\nتتيح اللوحة السفلية إرسال ping لجميع الاتصالات. انقر على فحص الصحة.\n\nملاحظة: السجل محفوظ للجلسة الحالية فقط.
help.topic.graph-view.body=# عرض الرسم البياني\n\nيُظهر علاقات المفاتيح الخارجية بين الجداول كمخطط ERD.\n\n## كيفية استخدامه\n\n• حدد اتصالاً\n• اختر جدولاً جذراً من القائمة المنسدلة\n• انقر على اكتشاف\n\n## التنقل\n\n• حوّم فوق عقدة: لإبراز العلاقات\n• التكبير: شريط التمرير أو Ctrl+التمرير\n• ملاءمة الشاشة: إعادة تعيين التكبير\n\n## أنواع الحواف\n\nالمنحنيات الصلبة = قيود FK المؤكدة.\nالمنحنيات المنقطة = روابط إرشادية عبر أنماط تسمية الأعمدة.
help.topic.migration-drift.body=# انجراف الهجرة\n\nيقارن مخطط قاعدتي بيانات ويبلغ عن الاختلافات.\n\n## كيفية استخدامه\n\n• حدد اتصال المصدر وقاعدة البيانات\n• حدد اتصال الهدف وقاعدة البيانات\n• انقر على تحليل\n\nأنواع الاختلافات:\n• جدول مفقود (أحمر)\n• جدول زائد (أصفر)\n• عمود مفقود (أحمر)\n• عمود زائد (أصفر)\n• عدم تطابق النوع (أزرق)\n\n## نص SQL التصحيح\n\nيولد ALTER TABLE / CREATE TABLE لمحاذاة الهدف مع المصدر.
help.topic.row-count-diff.body=# فرق عدد الصفوف\n\nيقارن عدد الصفوف في كل جدول بين قاعدتي بيانات.\n\n## قراءة النتائج\n\n• متزامن: كلتا قاعدتي البيانات لديهما نفس عدد الصفوف\n• الهدف متأخر: الهدف لديه صفوف أقل من المصدر\n• الهدف متقدم: الهدف لديه صفوف أكثر من المصدر\n\nيعرض عمود الفرق القيمة الدقيقة.
help.topic.query-analyzer.body=# محلل الاستعلامات\n\nيتيح استعلام أي قاعدة بيانات متصلة. وضعان:\n\n## وضع التدفق (الافتراضي)\n\nمنشئ استعلامات مرئي. انقر نقراً مزدوجاً على جدول لإضافته. انقر على زر المنفذ لبدء JOIN. ضع علامة على الأعمدة لـ SELECT.\n\n## وضع SQL\n\nمحرر نص للاستعلامات المكتوبة يدوياً.
help.topic.connection-health.body=# صحة الاتصالات\n\nيرسل ping لجميع اتصالاتك المحفوظة ويبلغ عن:\n• الحالة: موافق أو متدهور أو معطل\n• الكمون: وقت الرحلة ذهاباً وإياباً بالميلي ثانية\n• التفاصيل: رسالة الخطأ إذا فشل الاتصال\n\nانقر على اختبار الكل لتشغيل الفحص.
help.topic.masking-coverage.body=# تغطية الإخفاء\n\nيفحص مخططك بحثاً عن أعمدة قد تحتوي على بيانات شخصية ويعرض أيها مشمول بقواعد الإخفاء.\n\n## فئات الأعمدة المكتشفة\n\n• البريد الإلكتروني\n• الهاتف\n• العنوان\n• IBAN\n• الهوية الوطنية\n\n## قراءة النتائج\n\nأخضر = سيتم إخفاء العمود عند النسخ مع تفعيل إخفاء البيانات الشخصية.\nأحمر = العمود يبدو أنه يحتوي على بيانات شخصية لكنه غير مشمول.
help.topic.presets.body=# قوالب النسخ\n\nيحفظ تكوينات النسخ المستخدمة بشكل متكرر لتشغيلها بنقرة واحدة.\n\n## حفظ قالب\n\nاملأ النموذج: الاسم والاتصالات والكيان والعمق. انقر على حفظ القالب.\n\n## تشغيل قالب\n\nاختر قالباً محفوظاً وانقر على تشغيل الآن.
help.topic.scheduled-sync.body=# المزامنة المجدولة\n\nيعرّف مهام النسخ المتكررة التي تعمل تلقائياً وفق جدول أو يمكن تشغيلها يدوياً.\n\n## إعداد مزامنة\n\nاملأ الاسم والكيان والاتصالات والعمق. ثم حدد جدولاً:\n• تعبير Cron: cron قياسي بـ 5 حقول\n• الفترة (دقائق): التشغيل كل N دقيقة\n\nاترك كليهما فارغاً للتشغيل اليدوي فقط.\n\n## التشغيل اليدوي\n\nاختر مزامنة من القائمة وانقر على تشغيل الآن في أي وقت.
help.topic.faq.body=# الأسئلة الشائعة\n\n## ما هو العمق وكيف أختاره؟\n\nيتحكم في عدد مستويات الجداول ذات الصلة التي يتم متابعتها. ابدأ بـ 3.\n\n## ماذا يحدث للمفاتيح الأساسية في الهدف؟\n\nمع استراتيجية إعادة توليد المعرّفات الافتراضية، يحصل كل سجل منسوخ على مفتاح أساسي جديد.\n\n## هل يمكنني النسخ دون الكتابة فوق البيانات الموجودة؟\n\nنعم. اضبط "عند التعارض" على "تخطي الموجودة".\n\n## ما هو ملف .rrpkg؟\n\nملف حزمة محمول (أرشيف ZIP) يحتوي على جميع السجلات المنسوخة.\n\n## هل يعدّل الإخفاء بيانات المصدر؟\n\nلا. يؤثر الإخفاء فقط على البيانات المكتوبة في الهدف.\n\n## هل يمكنني النسخ بين محركات قواعد بيانات مختلفة؟\n\nنعم، طالما أن المخططات متوافقة.
