help.topic.faq.title=FAQ
help.topic.getting-started.body=# Erste Schritte\n\nRecordRelay kopiert einen einzelnen Datenbankdatensatz — und jeden damit verbundenen Datensatz — von einer Datenbank in eine andere. Es ist kein ETL-Tool. Stellen Sie es sich als eine Möglichkeit vor, einen bestimmten Kunden, eine Bestellung oder einen Fall aus der Produktion in Minuten in Ihre lokale oder Testumgebung zu übertragen.\n\n## Verbindungen zuerst hinzufügen\n\nÖffnen Sie Verbindungen über die Seitenleiste. Klicken Sie auf Hinzufügen… und geben Sie Host, Port, Datenbankname und Anmeldedaten für jede benötigte Datenbank ein (z.B. prod-db und local-db).\n\n## Umgebungen erstellen (optional)\n\nUmgebungen sind benannte Gruppen wie "prod", "staging", "local". Öffnen Sie Umgebungen und klicken Sie auf Hinzufügen…, um sie zu erstellen. Dies ist optional, macht aber die Verbindungs-Dropdowns lesbarer.\n\n## Ersten Datensatz klonen\n\nÖffnen Sie Clone Context über die Seitenleiste. Folgen Sie den vier Schritten:\n• Schritt 1: Quell- und Zielverbindung wählen\n• Schritt 2: Wurzeltabelle auswählen und Datensatz-ID eingeben\n• Schritt 3: Tiefe festlegen (3 ist ein guter Ausgangspunkt) und Konfliktlösung auf Standard lassen\n• Schritt 4: optional Feldwerte im Ziel überschreiben\n\nKlicken Sie auf Kontext klonen und beobachten Sie das Log.
help.topic.clone-context.body=# Kontext klonen\n\nDer Hauptbildschirm. Kopiert einen Datensatz und alle verbundenen Datensätze von einer Quell- in eine Zieldatenbank.\n\n## Schritt 1 — Verbindungen auswählen\n\nQuelle: die zu lesende Datenbank (z.B. Produktion).\nZiel: die zu schreibende Datenbank (z.B. lokal).\n\nExportmodus-Checkbox: speichert statt in die Zieldatenbank zu schreiben alles in eine .rrpkg-Datei.\n\n## Schritt 2 — Tabelle & Datensatz\n\nWurzeltabelle: die Tabelle, in der Ihr Datensatz liegt (z.B. orders, customers). Das Dropdown wird automatisch gefüllt, wenn Sie eine Quellverbindung wählen.\n\nErkennen-Schaltfläche: analysiert Fremdschlüssel-Beziehungen, um die wahrscheinlichsten Wurzeltabellen vorzuschlagen.\n\nPrimärschlüssel-Spalte: die Spalte, die jede Zeile eindeutig identifiziert (fast immer id).\n\nDatensatz-ID: der Wert in der PK-Spalte für den zu klonenden Datensatz.\n\n## Schritt 3 — Optionen\n\nBeziehungstiefe: wie viele Ebenen verknüpfter Tabellen verfolgt werden. Tiefe 1 = nur Wurzeldatensatz. Tiefe 2 = Wurzel + direkte Kinder. Tiefe 3 = Wurzel + Kinder + Enkel. Mit 3 beginnen.\n\nPII maskieren: ersetzt E-Mail-Adressen, Telefonnummern, Adressen, IBANs und nationale IDs durch realistische Fake-Werte.\n\nBei Konflikt: was zu tun ist, wenn das Ziel bereits Daten enthält. Siehe Konfliktlösung.\n\n## Schritt 4 — Feldüberschreibungen\n\nErmöglicht das Ändern bestimmter Spaltenwerte während des Klonens. Beispiel: created_by auf ein Testbenutzerkonto setzen. Leere Tabelle gilt für alle Tabellen.\n\n## Vorschau-Schaltfläche\n\nFührt einen Testlauf ohne Schreiben durch. Zeigt, welche Tabellen und wie viele Zeilen kopiert würden.
help.topic.conflict-resolution.body=# Konfliktlösung\n\nWenn RecordRelay Datensätze in ein Ziel schreibt, das bereits Daten enthält, benötigt es eine Strategie. Die Combobox "Bei Konflikt" in Schritt 3 bietet vier Optionen.\n\n## Identitäten neu generieren (Standard — empfohlen)\n\nWeist jedem geklonten Datensatz neue Primärschlüssel zu und aktualisiert alle Fremdschlüssel entsprechend. Sequenzen werden danach erhöht.\n\nWann verwenden: fast immer. Sicherste Option.\n\n## Namespace isolieren\n\nVerschiebt alle IDs in einen separaten numerischen Bereich, damit mehrere geklonte Kontexte im selben Zielschema koexistieren können.\n\nWann verwenden: wenn mehrere Teammitglieder separate Testdatensätze in derselben gemeinsamen Entwicklungsdatenbank benötigen.\n\n## Fehlschlagen bei Konflikt\n\nBricht ab, bevor eine einzige Zeile geschrieben wird, wenn in einer betroffenen Tabelle Datensätze vorhanden sind.\n\nWann verwenden: automatisierte Test-Pipelines oder initiale Umgebungssetup-Skripte.\n\n## Vorhandene überspringen\n\nÜberspringt stillschweigend Datensätze, deren Primärschlüssel bereits im Ziel vorhanden ist.\nAuf PostgreSQL: ON CONFLICT DO NOTHING; MySQL: INSERT IGNORE; SQLite: INSERT OR IGNORE.\n\nWann verwenden: beim Aktualisieren eines zuvor geklonten Datensatzes.
help.topic.environments.body=# Umgebungen\n\nUmgebungen sind benannte logische Gruppen für Datenbankverbindungen. Beispiele: prod, staging, local, ci.\n\nFür RecordRelay sind Umgebungen nicht erforderlich — sie sind optional. Bei vielen Verbindungen machen sie die Dropdowns lesbarer.\n\n## So erstellen Sie eine\n\nÖffnen Sie Umgebungen über die Seitenleiste. Klicken Sie auf Hinzufügen…, geben Sie einen Namen und eine optionale Beschreibung ein, dann OK.\n\nVerbindungen werden auf dem Verbindungsbildschirm Umgebungen zugewiesen.
help.topic.connections.body=# Verbindungen\n\nEine Verbindung enthält Anmeldedaten und Netzwerkeinstellungen für eine Datenbank. Für das Klonen werden mindestens zwei Verbindungen benötigt.\n\n## Verbindung hinzufügen\n\nKlicken Sie auf Hinzufügen…. Füllen Sie aus:\n• Name: kurzes Label (z.B. prod-db, local-dev)\n• Typ: Datenbankmotor (PostgreSQL, MySQL usw.)\n• Host, Port, Datenbank: Netzwerkadresse und Datenbankname\n• Benutzer und Passwort: Anmeldedaten\n\n## Verbindung testen\n\nZeile auswählen und auf Verbindung testen klicken. RecordRelay meldet Latenz oder Fehlerursache.
help.topic.discovery.body=# Entdeckung\n\nErmöglicht das Durchsuchen der Tabellen- und Spaltenstruktur jeder verbundenen Datenbank ohne Abfragen.\n\n## Verwendung\n\n• Verbindung aus dem Dropdown wählen\n• Datenbank wählen\n• Tabelle wählen\n• Auf Spalten prüfen klicken\n\nDer rechte Bereich zeigt alle Spalten: Name, Datentyp, NULL-Erlaubnis und ob Primärschlüssel.\n\nNützlich zum Ermitteln des Wurzeltabellennamens vor dem Klonen.
help.topic.monitor.body=# Monitor / Dashboard\n\nZeigt, was während der aktuellen Anwendungssitzung passiert ist.\n\n## Klon-Verlauf\n\nJede Zeile repräsentiert einen Klon-Vorgang: Tabelle, Datensatz-ID, Quelle, Ziel, Anzahl der übertragenen Datensätze, Dauer und Ergebnis.\n\n## KPI-Karten\n\nOben sehen Sie Zusammenfassungszähler: übertragene Datensätze gesamt, Vorgangsanzahl, fehlgeschlagene Vorgänge und letzte Dauer.\n\n## Verbindungsstatus\n\nDer untere Bereich ermöglicht das Pingen aller konfigurierten Verbindungen. Status prüfen klicken.\n\nHinweis: Verlauf gilt nur für die aktuelle Sitzung.
help.topic.graph-view.body=# Diagrammansicht\n\nVisualisiert Fremdschlüssel-Beziehungen zwischen Tabellen als ERD-Diagramm.\n\n## Verwendung\n\n• Verbindung wählen\n• Wurzeltabelle aus Dropdown wählen\n• Auf Erkunden klicken\n\n## Navigation\n\n• Über Knoten hovern: lenkt den Fokus auf eine Beziehung\n• Zoom: Schieberegler, +/− Schaltflächen oder Strg+Scrollen\n• An Bildschirm anpassen: setzt Zoom zurück\n\n## Kantentypen\n\nDurchgezogene Kurven = bestätigte FK-Einschränkungen.\nGestrichelte Kurven = heuristische Links durch Spaltennamenmuster.
help.topic.migration-drift.body=# Schema-Abweichung\n\nVergleicht das Schema zweier Datenbanken und meldet Unterschiede. Nützlich zum Erkennen fehlender Migrationen.\n\n## Verwendung\n\n• Quellverbindung und -datenbank wählen\n• Zielverbindung und -datenbank wählen\n• Auf Analysieren klicken\n\nDie Ergebnistabelle zeigt jeden Unterschied mit farbcodiertem Typ:\n• Fehlende Tabelle (rot)\n• Zusätzliche Tabelle (gelb)\n• Fehlende Spalte (rot)\n• Zusätzliche Spalte (gelb)\n• Typ-Abweichung (blau)\n\n## SQL-Patch-Skript\n\nDie Schaltfläche SQL generieren erzeugt ein ALTER TABLE / CREATE TABLE-Skript.
help.topic.row-count-diff.body=# Zeilenanzahl-Vergleich\n\nVergleicht die Zeilenanzahl in jeder Tabelle über zwei Datenbanken hinweg.\n\n## Ergebnisse lesen\n\n• Synchron: beide Datenbanken haben dieselbe Zeilenanzahl\n• Ziel zurück: Ziel hat weniger Zeilen als Quelle\n• Ziel vorne: Ziel hat mehr Zeilen als Quelle\n\nDie Differenz-Spalte zeigt den genauen Unterschied.
help.topic.query-analyzer.body=# Abfrageanalysator\n\nErmöglicht das Abfragen jeder verbundenen Datenbank. Zwei Modi:\n\n## Flow-Modus (Standard)\n\nVisueller Abfrage-Builder. Doppelklick auf eine Tabelle im linken Bereich, um sie hinzuzufügen. Port-Schaltfläche klicken, um JOIN zu starten. Spalten ankreuzen für SELECT. WHERE, ORDER BY und LIMIT rechts hinzufügen.\n\n## SQL-Modus\n\nTexteditor für handgeschriebene Abfragen. Mit Symbolleisten-Schaltfläche wechseln.
help.topic.connection-health.body=# Verbindungsstatus\n\nPingt alle gespeicherten Verbindungen und meldet:\n• Status: OK, Beeinträchtigt oder Nicht erreichbar\n• Latenz: Hin- und Rückfahrtzeit in Millisekunden\n• Details: Fehlermeldung bei Verbindungsfehler\n\nAuf Alle testen klicken, um den Check durchzuführen.
help.topic.masking-coverage.body=# Maskierungsabdeckung\n\nDurchsucht Ihr Schema nach Spalten, die PII enthalten könnten, und zeigt, welche durch Maskierungsregeln abgedeckt sind.\n\n## Erkannte Spaltenkategorien\n\n• E-MAIL: E-Mail-Adress-Spalten\n• TELEFON: Telefonnummer-Spalten\n• ADRESSE: adressbezogene Spalten\n• IBAN: Bankkontonummer-Spalten\n• NATIONALE_ID: nationale Identitätsnummer-Spalten\n\n## Ergebnisse lesen\n\nGrün = Spalte wird beim Klonen mit PII maskieren maskiert.\nRot (exponiert) = Spalte sieht nach PII aus, ist aber nicht abgedeckt.\n\nNur exponierte Spalten anzeigen-Checkbox zum Filtern verwenden.
help.topic.presets.body=# Klon-Vorlagen\n\nHäufig verwendete Klon-Konfigurationen speichern und per Klick ausführen.\n\n## Vorlage speichern\n\nFormular unten ausfüllen: Name, Verbindungen, Entitätsname und -ID, Tiefe, optional Feldüberschreibungen. Vorlage speichern klicken.\n\n## Vorlage ausführen\n\nGespeicherte Vorlage aus der Liste auswählen und Jetzt ausführen klicken.
help.topic.scheduled-sync.body=# Geplante Synchronisierung\n\nDefiniert wiederkehrende Klon-Jobs, die automatisch nach Zeitplan oder manuell ausgeführt werden.\n\n## Synchronisierung einrichten\n\nName, Entität, Verbindungen und Tiefe wie bei einer Vorlage ausfüllen. Dann Zeitplan festlegen:\n• Cron-Ausdruck: Standard-5-Felder-Cron (z.B. 0 6 * * 1 für jeden Montag um 06:00)\n• Intervall (Minuten): alle N Minuten ausführen\n\nBeide leer lassen für rein manuelle Ausführung.\n\n## Manuell ausführen\n\nSynchronisierung aus der Liste wählen und Jetzt ausführen klicken.
help.topic.faq.body=# Häufig gestellte Fragen\n\n## Was ist Tiefe und wie wähle ich sie?\n\nTiefe steuert, wie viele Ebenen verknüpfter Tabellen verfolgt werden. Mit 3 beginnen. Bei zu langer Klondauer reduzieren, bei fehlenden Datensätzen erhöhen.\n\n## Was passiert mit Primärschlüsseln im Ziel?\n\nMit der Standard-Strategie Identitäten neu generieren erhält jeder geklonte Datensatz einen neuen Primärschlüssel.\n\n## Kann ich klonen, ohne vorhandene Daten zu überschreiben?\n\nJa. Bei Konflikt auf Vorhandene überspringen setzen.\n\n## Was ist eine .rrpkg-Datei?\n\nEin portables Paket (ZIP-Archiv) mit allen geklonten Datensätzen. Im Exportmodus erstellen.\n\n## Verändert die Maskierung die Quelldaten?\n\nNein. Nur die Zieldaten werden verändert.\n\n## Kann ich über verschiedene Datenbanktypen klonen?\n\nJa, bei kompatiblen Schemas. Spaltentyp-Unterschiede werden auf Treiberebene aufgelöst.
