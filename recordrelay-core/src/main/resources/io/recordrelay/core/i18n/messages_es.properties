help.topic.getting-started.body=# Primeros pasos\n\nRecordRelay copia un único registro de base de datos — y cada registro relacionado — de una base de datos a otra. No es una herramienta ETL. Piénselo como una forma de reproducir un cliente, pedido o caso específico de producción en su entorno local en minutos.\n\n## Agregue sus conexiones primero\n\nAbra Conexiones desde la barra lateral. Haga clic en Agregar… e ingrese el host, puerto, nombre de base de datos y credenciales para cada base de datos.\n\n## Crear entornos (opcional)\n\nLos entornos son grupos con nombre como "prod", "staging", "local". Abra Entornos y haga clic en Agregar… para crearlos.\n\n## Clonar su primer registro\n\nAbra Clone Context desde la barra lateral. Siga los cuatro pasos:\n• Paso 1: elegir conexión de origen y destino\n• Paso 2: seleccionar tabla raíz e ingresar ID de registro\n• Paso 3: establecer profundidad (3 es un buen punto de partida)\n• Paso 4: opcionalmente sobrescribir valores de campo\n\nHaga clic en Clonar contexto y observe el log.
help.topic.clone-context.body=# Contexto de clonación\n\nLa pantalla principal. Copia un registro y todos los registros conectados de una base de datos de origen a una de destino.\n\n## Paso 1 — Seleccionar conexiones\n\nOrigen: la base de datos a leer.\nDestino: la base de datos a escribir.\n\n## Paso 2 — Tabla y registro\n\nTabla raíz: la tabla donde vive su registro. Detectar: analiza relaciones FK para sugerir las tablas raíz más probables.\n\n## Paso 3 — Opciones\n\nProfundidad de relación: cuántos niveles de tablas relacionadas seguir. Comenzar con 3.\nEnmascarar PII: reemplaza datos personales con valores falsos realistas.\nAl conflicto: qué hacer cuando el destino ya tiene datos.\n\n## Paso 4 — Sobrescrituras de campos\n\nPermite cambiar valores de columnas específicas durante la clonación.\n\n## Botón Vista previa\n\nEjecuta sin escribir nada. Muestra qué tablas y cuántas filas se copiarían.
help.topic.conflict-resolution.body=# Resolución de conflictos\n\nCuando RecordRelay escribe en un destino que ya contiene datos, necesita una estrategia. La caja "Al conflicto" en el Paso 3 ofrece cuatro opciones.\n\n## Regenerar identidades (predeterminado — recomendado)\n\nAsigna nuevas claves primarias a cada registro clonado y actualiza todas las claves foráneas.\n\nCuándo usar: casi siempre.\n\n## Aislar espacio de nombres\n\nDesplaza todos los IDs a un rango numérico separado para que múltiples contextos coexistan.\n\nCuándo usar: cuando varios miembros del equipo necesitan conjuntos de datos de prueba separados.\n\n## Fallar con seguridad\n\nAbort antes de escribir si alguna tabla afectada ya tiene registros.\n\nCuándo usar: pipelines de prueba automatizados.\n\n## Omitir existentes\n\nOmite silenciosamente registros cuya clave primaria ya existe en el destino.\nPostgreSQL: ON CONFLICT DO NOTHING; MySQL: INSERT IGNORE; SQLite: INSERT OR IGNORE.
help.topic.environments.body=# Entornos\n\nLos entornos son grupos lógicos con nombre para sus conexiones de base de datos. Ejemplos: prod, staging, local, ci.\n\nNo son necesarios para usar RecordRelay — son opcionales.\n\n## Cómo crear uno\n\nAbra Entornos desde la barra lateral. Haga clic en Agregar…, dé un nombre y descripción opcional, luego Aceptar.
help.topic.connections.body=# Conexiones\n\nUna conexión es un conjunto de credenciales y configuración de red. Necesita al menos dos conexiones para clonar.\n\n## Agregar una conexión\n\nHaga clic en Agregar…. Complete:\n• Nombre: etiqueta corta\n• Tipo: motor de base de datos\n• Host, Puerto, Base de datos\n• Usuario y Contraseña\n\n## Probar una conexión\n\nSeleccione una fila y haga clic en Probar conexión.
help.topic.discovery.body=# Descubrimiento\n\nPermite explorar la estructura de tablas y columnas de cualquier base de datos conectada.\n\n## Cómo usarlo\n\n• Seleccionar conexión\n• Seleccionar base de datos\n• Seleccionar tabla\n• Hacer clic en Inspeccionar columnas\n\nEl panel derecho muestra todas las columnas con nombre, tipo, nulabilidad y si es clave primaria.
help.topic.monitor.body=# Monitor / Panel\n\nMuestra lo que sucedió durante la sesión actual.\n\n## Historial de clonación\n\nCada fila representa una operación de clonación con tabla, ID, origen, destino, registros, duración y resultado.\n\n## Tarjetas KPI\n\nContadores resumen en la parte superior.\n\n## Salud de conexiones\n\nEl panel inferior permite hacer ping a todas las conexiones. Haga clic en Verificar salud.\n\nNota: el historial es solo para la sesión actual.
help.topic.graph-view.body=# Vista de grafo\n\nVisualiza las relaciones de clave foránea entre tablas como un diagrama ERD.\n\n## Cómo usarlo\n\n• Seleccionar conexión\n• Elegir tabla raíz\n• Hacer clic en Descubrir\n\n## Navegación\n\n• Pasar sobre nodo: resalta relaciones\n• Zoom: control deslizante o Ctrl+Desplazar\n• Ajustar a pantalla: restablece zoom\n\n## Tipos de aristas\n\nCurvas sólidas = restricciones FK confirmadas.\nCurvas discontinuas = enlaces heurísticos por patrones de nombres.
help.topic.migration-drift.body=# Deriva de migración\n\nCompara el esquema de dos bases de datos y reporta diferencias.\n\n## Cómo usarlo\n\n• Seleccionar origen y base de datos\n• Seleccionar destino y base de datos\n• Hacer clic en Analizar\n\nTipos de diferencias:\n• Tabla faltante (rojo)\n• Tabla extra (amarillo)\n• Columna faltante (rojo)\n• Columna extra (amarillo)\n• Tipo incompatible (azul)\n\n## Script SQL Patch\n\nGenera ALTER TABLE / CREATE TABLE para alinear el destino con el origen.
help.topic.row-count-diff.body=# Diferencia de filas\n\nCompara el número de filas en cada tabla entre dos bases de datos.\n\n## Leer resultados\n\n• Sincronizado: mismo conteo en ambas\n• Destino atrás: destino tiene menos filas\n• Destino adelante: destino tiene más filas\n\nLa columna Diferencia muestra el valor exacto.
help.topic.query-analyzer.body=# Analizador de consultas\n\nPermite consultar cualquier base de datos conectada. Dos modos:\n\n## Modo flujo (predeterminado)\n\nConstructor visual de consultas. Doble clic en tabla para agregarla. Clic en puerto para iniciar JOIN. Marcar columnas para SELECT.\n\n## Modo SQL\n\nEditor de texto para consultas escritas a mano.
help.topic.connection-health.body=# Salud de conexiones\n\nHace ping a todas las conexiones guardadas e informa:\n• Estado: OK, Degradado o Caído\n• Latencia: tiempo de ida y vuelta en milisegundos\n• Detalle: mensaje de error si falló\n\nHaga clic en Probar todo para ejecutar la verificación.
help.topic.masking-coverage.body=# Cobertura de enmascaramiento\n\nEscanea su esquema en busca de columnas que podrían contener PII y muestra cuáles están cubiertas.\n\n## Categorías detectadas\n\n• EMAIL\n• TELÉFONO\n• DIRECCIÓN\n• IBAN\n• ID NACIONAL\n\n## Leer resultados\n\nVerde = columna será enmascarada al clonar con PII habilitado.\nRojo = columna parece PII pero no está cubierta.
help.topic.presets.body=# Plantillas de clonación\n\nGuarda configuraciones de clonación frecuentes para ejecutarlas con un clic.\n\n## Guardar una plantilla\n\nComplete el formulario: nombre, conexiones, entidad, profundidad. Haga clic en Guardar plantilla.\n\n## Ejecutar una plantilla\n\nSeleccione una plantilla guardada y haga clic en Ejecutar ahora.
help.topic.scheduled-sync.body=# Sincronización programada\n\nDefine trabajos de clonación recurrentes que se ejecutan automáticamente o manualmente.\n\n## Configurar sincronización\n\nComplete nombre, entidad, conexiones y profundidad. Luego establezca un horario:\n• Expresión Cron: cron estándar de 5 campos\n• Intervalo (minutos): ejecutar cada N minutos\n\nDejar ambos en blanco para solo manual.\n\n## Ejecutar manualmente\n\nSeleccione sincronización y haga clic en Ejecutar ahora.
help.topic.faq.body=# Preguntas frecuentes\n\n## ¿Qué es la profundidad?\n\nControla cuántos niveles de tablas relacionadas se siguen. Comenzar con 3.\n\n## ¿Qué pasa con las claves primarias?\n\nCon Regenerar identidades, cada registro clonado recibe una nueva clave primaria.\n\n## ¿Puedo clonar sin sobrescribir datos?\n\nSí. Establecer Al conflicto en Omitir existentes.\n\n## ¿Qué es un archivo .rrpkg?\n\nUn archivo de paquete portátil (ZIP) con todos los registros clonados.\n\n## ¿El enmascaramiento modifica los datos de origen?\n\nNo. Solo afecta los datos escritos en el destino.\n\n## ¿Puedo clonar entre diferentes motores de base de datos?\n\nSí, si los esquemas son compatibles.
