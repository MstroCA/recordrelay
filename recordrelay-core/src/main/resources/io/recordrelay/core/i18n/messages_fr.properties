help.topic.faq.title=FAQ
help.topic.getting-started.body=# Premiers pas\n\nRecordRelay copie un seul enregistrement de base de données — et chaque enregistrement associé — d'une base de données à une autre. Ce n'est pas un outil ETL. Considérez-le comme un moyen de reproduire un client, une commande ou un dossier spécifique depuis la production vers votre environnement local en quelques minutes.\n\n## Ajoutez d'abord vos connexions\n\nOuvrez Connexions depuis la barre latérale. Cliquez sur Ajouter… et renseignez l'hôte, le port, le nom de la base de données et les identifiants.\n\n## Créer des environnements (optionnel)\n\nLes environnements sont des groupes nommés comme "prod", "staging", "local". Ouvrez Environnements et cliquez sur Ajouter… pour les créer.\n\n## Cloner votre premier enregistrement\n\nOuvrez Clone Context depuis la barre latérale. Suivez les quatre étapes:\n• Étape 1: choisir la connexion source et cible\n• Étape 2: sélectionner la table racine et saisir l'ID d'enregistrement\n• Étape 3: définir la profondeur (3 est un bon point de départ)\n• Étape 4: remplacer optionnellement les valeurs de champs\n\nCliquez sur Cloner le contexte et observez le log.
help.topic.clone-context.body=# Contexte de clonage\n\nL'écran principal. Copie un enregistrement et tous les enregistrements connectés d'une base de données source vers une base de données cible.\n\n## Étape 1 — Sélectionner les connexions\n\nSource: la base de données à lire.\nCible: la base de données à écrire.\n\n## Étape 2 — Table et enregistrement\n\nTable racine: la table où se trouve votre enregistrement. Détecter: analyse les relations FK pour suggérer les tables racines les plus probables.\n\n## Étape 3 — Options\n\nProfondeur de relation: combien de niveaux de tables liées suivre. Commencer avec 3.\nMasquer les DCP: remplace les données personnelles par des valeurs fictives réalistes.\nEn cas de conflit: que faire quand la cible contient déjà des données.\n\n## Étape 4 — Remplacements de champs\n\nPermet de modifier des valeurs de colonnes spécifiques pendant le clonage.\n\n## Bouton Aperçu\n\nExécute sans rien écrire. Montre quelles tables et combien de lignes seraient copiées.
help.topic.conflict-resolution.body=# Résolution de conflits\n\nQuand RecordRelay écrit dans une cible qui contient déjà des données, il a besoin d'une stratégie. La combobox "En cas de conflit" offre quatre options.\n\n## Régénérer les identités (par défaut — recommandé)\n\nAttribue de nouvelles clés primaires à chaque enregistrement cloné et met à jour toutes les clés étrangères.\n\nQuand utiliser: presque toujours.\n\n## Isoler l'espace de noms\n\nDécale tous les IDs vers une plage numérique séparée.\n\nQuand utiliser: quand plusieurs membres de l'équipe ont besoin de jeux de données séparés.\n\n## Échouer en sécurité\n\nAnnule avant d'écrire si une table affectée contient déjà des enregistrements.\n\n## Ignorer les existants\n\nIgnore silencieusement les enregistrements dont la clé primaire existe déjà dans la cible.\nPostgreSQL: ON CONFLICT DO NOTHING; MySQL: INSERT IGNORE; SQLite: INSERT OR IGNORE.
help.topic.environments.body=# Environnements\n\nLes environnements sont des groupes logiques nommés pour vos connexions de base de données. Exemples: prod, staging, local, ci.\n\nIls ne sont pas nécessaires pour utiliser RecordRelay — ils sont optionnels.\n\n## Comment en créer un\n\nOuvrez Environnements depuis la barre latérale. Cliquez sur Ajouter…, donnez un nom et une description optionnelle, puis OK.
help.topic.connections.body=# Connexions\n\nUne connexion est un ensemble d'identifiants et de paramètres réseau. Vous avez besoin d'au moins deux connexions pour cloner.\n\n## Ajouter une connexion\n\nCliquez sur Ajouter…. Renseignez:\n• Nom: étiquette courte\n• Type: moteur de base de données\n• Hôte, Port, Base de données\n• Utilisateur et Mot de passe\n\n## Tester une connexion\n\nSélectionnez une ligne et cliquez sur Tester la connexion.
help.topic.discovery.body=# Découverte\n\nPermet de parcourir la structure des tables et colonnes de n'importe quelle base de données connectée.\n\n## Comment l'utiliser\n\n• Sélectionner une connexion\n• Sélectionner une base de données\n• Sélectionner une table\n• Cliquer sur Inspecter les colonnes\n\nLe panneau de droite affiche toutes les colonnes avec nom, type, nullabilité et si c'est une clé primaire.
help.topic.monitor.body=# Moniteur / Tableau de bord\n\nMontre ce qui s'est passé pendant la session en cours.\n\n## Historique de clonage\n\nChaque ligne représente une opération de clonage avec table, ID, source, cible, enregistrements, durée et résultat.\n\n## Cartes KPI\n\nCompteurs récapitulatifs en haut.\n\n## Santé des connexions\n\nLe panneau inférieur permet de pinger toutes les connexions. Cliquer sur Vérifier la santé.\n\nNote: l'historique est uniquement pour la session en cours.
help.topic.graph-view.body=# Vue graphique\n\nVisualise les relations de clé étrangère entre tables sous forme de diagramme ERD.\n\n## Comment l'utiliser\n\n• Sélectionner une connexion\n• Choisir une table racine\n• Cliquer sur Découvrir\n\n## Navigation\n\n• Survoler un nœud: met en évidence les relations\n• Zoom: curseur ou Ctrl+Défilement\n• Ajuster à l'écran: réinitialise le zoom\n\n## Types d'arêtes\n\nCourbes pleines = contraintes FK confirmées.\nCourbes en pointillés = liens heuristiques par motifs de noms.
help.topic.migration-drift.body=# Dérive de migration\n\nCompare le schéma de deux bases de données et rapporte les différences.\n\n## Comment l'utiliser\n\n• Sélectionner source et base de données\n• Sélectionner cible et base de données\n• Cliquer sur Analyser\n\nTypes de différences:\n• Table manquante (rouge)\n• Table supplémentaire (jaune)\n• Colonne manquante (rouge)\n• Colonne supplémentaire (jaune)\n• Type incompatible (bleu)\n\n## Script SQL Patch\n\nGénère ALTER TABLE / CREATE TABLE pour aligner la cible sur la source.
help.topic.row-count-diff.body=# Différence de lignes\n\nCompare le nombre de lignes dans chaque table entre deux bases de données.\n\n## Lire les résultats\n\n• Synchronisé: les deux bases ont le même nombre de lignes\n• Cible en retard: la cible a moins de lignes\n• Cible en avance: la cible a plus de lignes\n\nLa colonne Différence montre la valeur exacte.
help.topic.query-analyzer.body=# Analyseur de requêtes\n\nPermet d'interroger n'importe quelle base de données connectée. Deux modes:\n\n## Mode flux (par défaut)\n\nConstructeur visuel de requêtes. Double-cliquer sur une table pour l'ajouter. Cliquer sur le port pour démarrer un JOIN. Cocher les colonnes pour SELECT.\n\n## Mode SQL\n\nÉditeur de texte pour les requêtes manuscrites.
help.topic.connection-health.body=# Santé des connexions\n\nPinge toutes vos connexions enregistrées et rapporte:\n• Statut: OK, Dégradé ou Hors service\n• Latence: temps aller-retour en millisecondes\n• Détail: message d'erreur si la connexion a échoué\n\nCliquer sur Tout tester pour lancer la vérification.
help.topic.masking-coverage.body=# Couverture de masquage\n\nAnalyse votre schéma à la recherche de colonnes pouvant contenir des DCP et montre lesquelles sont couvertes.\n\n## Catégories détectées\n\n• EMAIL\n• TÉLÉPHONE\n• ADRESSE\n• IBAN\n• ID NATIONAL\n\n## Lire les résultats\n\nVert = la colonne sera masquée lors du clonage avec Masquer DCP activé.\nRouge = la colonne ressemble à des DCP mais n'est pas couverte.
help.topic.presets.body=# Modèles de clonage\n\nEnregistre les configurations de clonage fréquentes pour les exécuter en un clic.\n\n## Enregistrer un modèle\n\nRemplir le formulaire: nom, connexions, entité, profondeur. Cliquer sur Enregistrer le modèle.\n\n## Exécuter un modèle\n\nSélectionner un modèle enregistré et cliquer sur Exécuter maintenant.
help.topic.scheduled-sync.body=# Synchronisation planifiée\n\nDéfinit des tâches de clonage récurrentes s'exécutant automatiquement ou manuellement.\n\n## Configurer une synchronisation\n\nRemplir nom, entité, connexions et profondeur. Définir un calendrier:\n• Expression Cron: cron standard à 5 champs\n• Intervalle (minutes): exécuter toutes les N minutes\n\nLaisser les deux vides pour une exécution manuelle uniquement.\n\n## Exécuter manuellement\n\nSélectionner une synchronisation et cliquer sur Exécuter maintenant.
help.topic.faq.body=# Questions fréquentes\n\n## Qu'est-ce que la profondeur?\n\nContrôle combien de niveaux de tables liées sont suivis. Commencer avec 3.\n\n## Que se passe-t-il avec les clés primaires?\n\nAvec Régénérer les identités, chaque enregistrement cloné reçoit une nouvelle clé primaire.\n\n## Puis-je cloner sans écraser les données?\n\nOui. Régler En cas de conflit sur Ignorer les existants.\n\n## Qu'est-ce qu'un fichier .rrpkg?\n\nUn fichier de paquet portable (ZIP) contenant tous les enregistrements clonés.\n\n## Le masquage modifie-t-il les données source?\n\nNon. Seules les données écrites dans la cible sont affectées.\n\n## Puis-je cloner entre différents moteurs de base de données?\n\nOui, si les schémas sont compatibles.
