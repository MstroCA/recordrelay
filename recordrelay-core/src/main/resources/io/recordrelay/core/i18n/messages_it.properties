help.topic.faq.title=Domande frequenti
help.topic.getting-started.body=# Per iniziare\n\nRecordRelay copia un singolo record di database — e ogni record correlato — da un database a un altro. Non è uno strumento ETL. Pensatelo come un modo per riprodurre un cliente, un ordine o un caso specifico dalla produzione nel vostro ambiente locale in pochi minuti.\n\n## Aggiungere prima le connessioni\n\nAprire Connessioni dalla barra laterale. Fare clic su Aggiungi… e inserire host, porta, nome database e credenziali.\n\n## Creare ambienti (opzionale)\n\nGli ambienti sono gruppi denominati come "prod", "staging", "local". Aprire Ambienti e fare clic su Aggiungi… per crearli.\n\n## Clonare il primo record\n\nAprire Clone Context dalla barra laterale. Seguire i quattro passaggi:\n• Passo 1: scegliere connessione sorgente e destinazione\n• Passo 2: selezionare tabella radice e inserire ID record\n• Passo 3: impostare profondità (3 è un buon punto di partenza)\n• Passo 4: sovrascrivere opzionalmente valori dei campi\n\nFare clic su Clona contesto e osservare il log.
help.topic.clone-context.body=# Contesto di clonazione\n\nLa schermata principale. Copia un record e tutti i record connessi da un database sorgente a uno di destinazione.\n\n## Passo 1 — Selezionare le connessioni\n\nSorgente: il database da leggere.\nDestinazione: il database in cui scrivere.\n\n## Passo 2 — Tabella e record\n\nTabella radice: la tabella in cui si trova il record. Rilevare: analizza le relazioni FK per suggerire le tabelle radice più probabili.\n\n## Passo 3 — Opzioni\n\nProfondità relazione: quanti livelli di tabelle correlate seguire. Iniziare con 3.\nMaschera dati personali: sostituisce dati personali con valori fittizi realistici.\nIn caso di conflitto: cosa fare quando la destinazione contiene già dati.\n\n## Passo 4 — Sovrascritture campi\n\nPermette di modificare valori di colonne specifiche durante la clonazione.\n\n## Pulsante Anteprima\n\nEsegue senza scrivere nulla. Mostra quali tabelle e quante righe verrebbero copiate.
help.topic.conflict-resolution.body=# Risoluzione conflitti\n\nQuando RecordRelay scrive in una destinazione con dati esistenti, ha bisogno di una strategia. La combobox "In caso di conflitto" offre quattro opzioni.\n\n## Rigenera identità (predefinito — consigliato)\n\nAssegna nuove chiavi primarie a ogni record clonato e aggiorna tutte le chiavi esterne.\n\nQuando usare: quasi sempre.\n\n## Isola spazio dei nomi\n\nSposta tutti gli ID in un intervallo numerico separato.\n\nQuando usare: quando più membri del team necessitano di set di dati separati.\n\n## Interrompi in sicurezza\n\nAnnulla prima di scrivere se una tabella interessata contiene già record.\n\n## Salta esistenti\n\nIgnora silenziosamente i record la cui chiave primaria esiste già nella destinazione.\nPostgreSQL: ON CONFLICT DO NOTHING; MySQL: INSERT IGNORE; SQLite: INSERT OR IGNORE.
help.topic.environments.body=# Ambienti\n\nGli ambienti sono gruppi logici denominati per le connessioni di database. Esempi: prod, staging, local, ci.\n\nNon sono necessari per usare RecordRelay — sono opzionali.\n\n## Come crearne uno\n\nAprire Ambienti dalla barra laterale. Fare clic su Aggiungi…, dare un nome e descrizione opzionale, poi OK.
help.topic.connections.body=# Connessioni\n\nUna connessione è un insieme di credenziali e impostazioni di rete. Sono necessarie almeno due connessioni per clonare.\n\n## Aggiungere una connessione\n\nFare clic su Aggiungi…. Compilare:\n• Nome: etichetta breve\n• Tipo: motore database\n• Host, Porta, Database\n• Utente e Password\n\n## Testare una connessione\n\nSelezionare una riga e fare clic su Testa connessione.
help.topic.discovery.body=# Scoperta\n\nPermette di esplorare la struttura di tabelle e colonne di qualsiasi database connesso.\n\n## Come usarla\n\n• Selezionare una connessione\n• Selezionare un database\n• Selezionare una tabella\n• Fare clic su Ispeziona colonne\n\nIl pannello di destra mostra tutte le colonne con nome, tipo, nullabilità e se è chiave primaria.
help.topic.monitor.body=# Monitor / Dashboard\n\nMostra cosa è successo durante la sessione corrente.\n\n## Cronologia clonazione\n\nOgni riga rappresenta un'operazione di clonazione con tabella, ID, sorgente, destinazione, record, durata e risultato.\n\n## Schede KPI\n\nContatori riassuntivi in cima.\n\n## Salute connessioni\n\nIl pannello inferiore consente di fare ping a tutte le connessioni. Fare clic su Controlla salute.\n\nNota: la cronologia è solo per la sessione corrente.
help.topic.graph-view.body=# Vista grafico\n\nVisualizza le relazioni di chiave esterna tra tabelle come diagramma ERD.\n\n## Come usarla\n\n• Selezionare una connessione\n• Scegliere tabella radice\n• Fare clic su Scopri\n\n## Navigazione\n\n• Passare su un nodo: evidenzia le relazioni\n• Zoom: cursore o Ctrl+Scorrimento\n• Adatta allo schermo: reimposta zoom\n\n## Tipi di archi\n\nCurve solide = vincoli FK confermati.\nCurve tratteggiate = collegamenti euristici per pattern di nomi.
help.topic.migration-drift.body=# Deriva migrazione\n\nConfronta lo schema di due database e riporta le differenze.\n\n## Come usarla\n\n• Selezionare sorgente e database\n• Selezionare destinazione e database\n• Fare clic su Analizza\n\nTipi di differenze:\n• Tabella mancante (rosso)\n• Tabella extra (giallo)\n• Colonna mancante (rosso)\n• Colonna extra (giallo)\n• Tipo incompatibile (blu)\n\n## Script SQL Patch\n\nGenera ALTER TABLE / CREATE TABLE per allineare la destinazione alla sorgente.
help.topic.row-count-diff.body=# Differenza righe\n\nConfronta il numero di righe in ogni tabella tra due database.\n\n## Leggere i risultati\n\n• Sincronizzato: entrambi i database hanno lo stesso numero di righe\n• Destinazione indietro: la destinazione ha meno righe\n• Destinazione avanti: la destinazione ha più righe\n\nLa colonna Differenza mostra il valore esatto.
help.topic.query-analyzer.body=# Analizzatore query\n\nPermette di interrogare qualsiasi database connesso. Due modalità:\n\n## Modalità flusso (predefinita)\n\nCostruttore visuale di query. Doppio clic su una tabella per aggiungerla. Clic sul porto per avviare un JOIN. Spuntare le colonne per SELECT.\n\n## Modalità SQL\n\nEditor di testo per query scritte a mano.
help.topic.connection-health.body=# Salute connessioni\n\nEsegue il ping di tutte le connessioni salvate e riporta:\n• Stato: OK, Degradato o Non raggiungibile\n• Latenza: tempo andata e ritorno in millisecondi\n• Dettaglio: messaggio di errore se la connessione ha fallito\n\nFare clic su Testa tutto per eseguire il controllo.
help.topic.masking-coverage.body=# Copertura mascheramento\n\nAnalizza lo schema alla ricerca di colonne che potrebbero contenere dati personali e mostra quali sono coperte.\n\n## Categorie rilevate\n\n• EMAIL\n• TELEFONO\n• INDIRIZZO\n• IBAN\n• ID NAZIONALE\n\n## Leggere i risultati\n\nVerde = la colonna verrà mascherata clonando con dati personali abilitato.\nRosso = la colonna sembra dati personali ma non è coperta.
help.topic.presets.body=# Modelli di clonazione\n\nSalva configurazioni di clonazione frequenti per eseguirle con un clic.\n\n## Salvare un modello\n\nCompilare il modulo: nome, connessioni, entità, profondità. Fare clic su Salva modello.\n\n## Eseguire un modello\n\nSelezionare un modello salvato e fare clic su Esegui ora.
help.topic.scheduled-sync.body=# Sincronizzazione pianificata\n\nDefinisce lavori di clonazione ricorrenti che si eseguono automaticamente o manualmente.\n\n## Configurare una sincronizzazione\n\nCompilare nome, entità, connessioni e profondità. Impostare un piano:\n• Espressione Cron: cron standard a 5 campi\n• Intervallo (minuti): eseguire ogni N minuti\n\nLasciare entrambi vuoti per esecuzione solo manuale.\n\n## Eseguire manualmente\n\nSelezionare una sincronizzazione e fare clic su Esegui ora.
help.topic.faq.body=# Domande frequenti\n\n## Cos'è la profondità?\n\nControlla quanti livelli di tabelle correlate vengono seguiti. Iniziare con 3.\n\n## Cosa succede alle chiavi primarie?\n\nCon Rigenera identità, ogni record clonato riceve una nuova chiave primaria.\n\n## Posso clonare senza sovrascrivere i dati?\n\nSì. Impostare In caso di conflitto su Salta esistenti.\n\n## Cos'è un file .rrpkg?\n\nUn file di pacchetto portabile (ZIP) contenente tutti i record clonati.\n\n## Il mascheramento modifica i dati sorgente?\n\nNo. Solo i dati scritti nella destinazione vengono modificati.\n\n## Posso clonare tra diversi motori di database?\n\nSì, se gli schemi sono compatibili.
