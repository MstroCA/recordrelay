help.topic.faq.title=よくある質問
help.topic.getting-started.body=# はじめに\n\nRecordRelayは1つのデータベースレコードとすべての関連レコードをあるデータベースから別のデータベースにコピーします。ETLツールではありません。本番環境の特定の顧客、注文、またはケースを数分でローカルまたはテスト環境に再現する手段です。\n\n## まず接続を追加する\n\nサイドバーから「接続」を開きます。「追加…」をクリックして各データベースのホスト、ポート、データベース名と認証情報を入力します。\n\n## 環境を作成する（任意）\n\n環境は「prod」「staging」「local」などの名前付きグループです。「環境」を開いて「追加…」をクリックして作成します。\n\n## 最初のレコードをクローンする\n\nサイドバーから「Clone Context」を開きます。4つのステップに従います：\n• ステップ1：ソースとターゲットの接続を選択\n• ステップ2：ルートテーブルを選択してレコードIDを入力\n• ステップ3：深度を設定（3が良い出発点）\n• ステップ4：任意でフィールド値をオーバーライド\n\n「コンテキストをクローン」をクリックしてログを確認します。
help.topic.clone-context.body=# クローンコンテキスト\n\nメイン画面。1つのレコードとすべての接続レコードをソースデータベースからターゲットデータベースにコピーします。\n\n## ステップ1 — 接続を選択\n\nソース：読み取るデータベース。\nターゲット：書き込むデータベース。\n\n## ステップ2 — テーブルとレコード\n\nルートテーブル：レコードが存在するテーブル。「検出」ボタン：FK関係を分析して最も可能性の高いルートテーブルを提案します。\n\n## ステップ3 — オプション\n\n関係の深度：関連テーブルを何レベルたどるか。3から始めてください。\n個人情報をマスク：個人データを現実的な偽の値に置き換えます。\n競合時：ターゲットにすでにデータがある場合の処理。\n\n## ステップ4 — フィールドオーバーライド\n\nクローン中に特定の列の値を変更できます。\n\n## プレビューボタン\n\n何も書き込まずにドライラン。コピーされるテーブルと行数を表示します。
help.topic.conflict-resolution.body=# 競合の解決\n\nRecordRelayがすでにデータを含むターゲットに書き込む場合、戦略が必要です。「競合時」コンボボックスは4つのオプションを提供します。\n\n## IDを再生成（デフォルト — 推奨）\n\n各クローンレコードに新しい主キーを割り当て、すべての外部キーを更新します。\n\n使用場面：ほぼ常に。\n\n## 名前空間を分離\n\nすべてのIDを別の数値範囲にオフセットします。\n\n使用場面：複数のチームメンバーが同じ共有開発データベースで別々のテストデータセットが必要な場合。\n\n## 安全に失敗\n\n影響を受けるテーブルにレコードがある場合、1行も書き込まずに中止します。\n\n## 既存をスキップ\n\n主キーがすでにターゲットに存在するレコードを静かにスキップします。\nPostgreSQL：ON CONFLICT DO NOTHING；MySQL：INSERT IGNORE；SQLite：INSERT OR IGNORE。
help.topic.environments.body=# 環境\n\n環境はデータベース接続の名前付き論理グループです。例：prod、staging、local、ci。\n\nRecordRelayを使用するために環境は必要ありません — オプションです。\n\n## 作成方法\n\nサイドバーから「環境」を開きます。「追加…」をクリックして名前と任意の説明を入力し、OKをクリックします。
help.topic.connections.body=# 接続\n\n接続はデータベースへのアクセスに必要な認証情報とネットワーク設定のセットです。クローンには少なくとも2つの接続が必要です。\n\n## 接続を追加\n\n「追加…」をクリック。入力：\n• 名前：短いラベル\n• タイプ：データベースエンジン\n• ホスト、ポート、データベース\n• ユーザーとパスワード\n\n## 接続をテスト\n\n行を選択して「接続をテスト」をクリックします。
help.topic.discovery.body=# ディスカバリー\n\nクエリを書かずに接続済みデータベースのテーブルと列の構造を閲覧できます。\n\n## 使い方\n\n• ドロップダウンから接続を選択\n• データベースを選択\n• テーブルを選択\n• 「列を検査」をクリック\n\n右パネルにすべての列（名前、データ型、NULL許可、主キーかどうか）が表示されます。
help.topic.monitor.body=# モニター / ダッシュボード\n\n現在のアプリケーションセッション中に何が起こったかを表示します。\n\n## クローン履歴\n\n各行はクローン操作を表します：テーブル、レコードID、ソース、ターゲット、転送レコード数、時間、結果。\n\n## KPIカード\n\n上部にサマリーカウンターが表示されます。\n\n## 接続の健全性\n\n下部パネルでは設定されたすべての接続にpingできます。「ヘルスチェック」をクリック。\n\n注意：履歴は現在のセッションのみ保持されます。
help.topic.graph-view.body=# グラフビュー\n\nデータベース内のテーブル間の外部キー関係をERDスタイルのダイアグラムとして視覚化します。\n\n## 使い方\n\n• 接続を選択\n• ドロップダウンからルートテーブルを選択\n• 「ディスカバー」をクリック\n\n## ナビゲーション\n\n• ノードにホバー：関連する関係を強調表示\n• ズーム：スライダー、+/-ボタン、またはCtrl+スクロール\n• 画面に合わせる：ズームをリセット\n\n## エッジタイプ\n\n実線曲線 = 確認済みFK制約。\n点線曲線 = 列名パターンによるヒューリスティックリンク。
help.topic.migration-drift.body=# マイグレーションドリフト\n\n2つのデータベースのスキーマを比較し、差異を報告します。\n\n## 使い方\n\n• ソース接続とデータベースを選択\n• ターゲット接続とデータベースを選択\n• 「分析」をクリック\n\n差異タイプ：\n• 不足テーブル（赤）\n• 余分なテーブル（黄）\n• 不足カラム（赤）\n• 余分なカラム（黄）\n• タイプ不一致（青）\n\n## SQLパッチスクリプト\n\nターゲットをソースに合わせるためのALTER TABLE / CREATE TABLEスクリプトを生成します。
help.topic.row-count-diff.body=# 行数差分\n\n2つのデータベース間で各テーブルの行数を比較します。\n\n## 結果の読み方\n\n• 同期：両データベースでこのテーブルの行数が同じ\n• ターゲット遅延：ターゲットの行数がソースより少ない\n• ターゲット先行：ターゲットの行数がソースより多い\n\n差分列は正確な差異を表示します。
help.topic.query-analyzer.body=# クエリアナライザー\n\n接続済みデータベースをクエリできます。2つのモード：\n\n## フローモード（デフォルト）\n\nビジュアルクエリビルダー。左パネルのテーブルをダブルクリックして追加。ポートボタンをクリックしてJOINを開始。SELECT用にカラムをチェック。\n\n## SQLモード\n\n手書きクエリ用のテキストエディター。
help.topic.connection-health.body=# 接続の健全性\n\nすべての保存済み接続にpingを送り、レポートします：\n• ステータス：OK、低下、またはダウン\n• レイテンシー：往復時間（ミリ秒）\n• 詳細：接続失敗時のエラーメッセージ\n\n「全てテスト」をクリックしてチェックを実行します。
help.topic.masking-coverage.body=# マスキングカバレッジ\n\nスキーマをPIIを含む可能性のある列についてスキャンし、どの列がカバーされているかを表示します。\n\n## 検出されるカラムカテゴリ\n\n• Eメール\n• 電話番号\n• 住所\n• IBAN\n• 国民ID\n\n## 結果の読み方\n\n緑 = マスク個人情報を有効にしてクローンするとこの列はマスクされます。\n赤（露出） = 列がPIIのように見えるがマスキングルールでカバーされていません。
help.topic.presets.body=# クローンプリセット\n\nよく使うクローン設定を保存してワンクリックで実行します。\n\n## プリセットを保存\n\nフォームを入力：名前、接続、エンティティ、深度。「プリセットを保存」をクリック。\n\n## プリセットを実行\n\n保存済みプリセットを選択して「今すぐ実行」をクリック。
help.topic.scheduled-sync.body=# スケジュール同期\n\nスケジュールで自動実行するか手動でトリガーできる繰り返しクローンジョブを定義します。\n\n## 同期を設定\n\n名前、エンティティ、接続、深度を入力。スケジュールを設定：\n• Cron式：標準5フィールドcron\n• インターバル（分）：N分ごとに実行\n\n手動のみの場合は両方空白にします。\n\n## 手動実行\n\nリストから同期を選択していつでも「今すぐ実行」をクリック。
help.topic.faq.body=# よくある質問\n\n## 深度とは何ですか？\n\n関連テーブルを何レベルたどるかを制御します。3から始めてください。\n\n## ターゲットの主キーはどうなりますか？\n\nデフォルトの「IDを再生成」戦略では、各クローンレコードは新しい主キーを取得します。\n\n## 既存データを上書きせずにクローンできますか？\n\nはい。「競合時」を「既存をスキップ」に設定します。\n\n## .rrpkgファイルとは何ですか？\n\nすべてのクローンレコードを含むポータブルパッケージファイル（ZIPアーカイブ）です。\n\n## マスキングはソースデータを変更しますか？\n\nいいえ。ターゲットに書き込まれるデータのみに影響します。\n\n## 異なるデータベースエンジン間でクローンできますか？\n\nはい、スキーマが互換性がある場合。
