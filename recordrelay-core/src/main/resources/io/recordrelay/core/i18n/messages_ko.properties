help.topic.getting-started.body=# 시작하기\n\nRecordRelay는 단일 데이터베이스 레코드와 모든 관련 레코드를 한 데이터베이스에서 다른 데이터베이스로 복사합니다. ETL 도구가 아닙니다. 프로덕션의 특정 고객, 주문 또는 사건을 로컬 또는 테스트 환경에 몇 분 안에 재현하는 방법으로 생각하세요.\n\n## 먼저 연결을 추가하세요\n\n사이드바에서 '연결'을 엽니다. '추가…'를 클릭하고 각 데이터베이스의 호스트, 포트, 데이터베이스 이름, 자격 증명을 입력합니다.\n\n## 환경 만들기 (선택 사항)\n\n환경은 "prod", "staging", "local" 같은 명명된 그룹입니다. '환경'을 열고 '추가…'를 클릭하여 만듭니다.\n\n## 첫 번째 레코드 클론하기\n\n사이드바에서 'Clone Context'를 엽니다. 네 단계를 따르세요:\n• 1단계: 소스와 대상 연결 선택\n• 2단계: 루트 테이블 선택 및 레코드 ID 입력\n• 3단계: 깊이 설정 (3이 좋은 시작점)\n• 4단계: 선택적으로 필드 값 재정의\n\n'컨텍스트 클론'을 클릭하고 로그를 확인합니다.
help.topic.clone-context.body=# 클론 컨텍스트\n\n메인 화면. 소스 데이터베이스에서 대상 데이터베이스로 레코드와 모든 연결된 레코드를 복사합니다.\n\n## 1단계 — 연결 선택\n\n소스: 읽을 데이터베이스.\n대상: 쓸 데이터베이스.\n\n## 2단계 — 테이블 및 레코드\n\n루트 테이블: 레코드가 있는 테이블. 감지 버튼: FK 관계를 분석하여 가능성 있는 루트 테이블을 제안합니다.\n\n## 3단계 — 옵션\n\n관계 깊이: 관련 테이블을 몇 레벨까지 따라갈지. 3부터 시작.\n개인정보 마스킹: 개인 데이터를 실감나는 가짜 값으로 대체합니다.\n충돌 시: 대상에 이미 데이터가 있을 때 처리 방법.\n\n## 4단계 — 필드 재정의\n\n클론 중 특정 열 값을 변경할 수 있습니다.\n\n## 미리보기 버튼\n\n아무것도 쓰지 않고 드라이 런. 어떤 테이블에서 몇 행이 복사될지 보여줍니다.
help.topic.conflict-resolution.body=# 충돌 해결\n\nRecordRelay가 이미 데이터를 포함한 대상에 쓸 때 전략이 필요합니다. "충돌 시" 콤보박스는 네 가지 옵션을 제공합니다.\n\n## ID 재생성 (기본값 — 권장)\n\n모든 클론 레코드에 새 기본 키를 할당하고 모든 외래 키를 업데이트합니다.\n\n사용 시기: 거의 항상.\n\n## 네임스페이스 격리\n\n모든 ID를 별도의 숫자 범위로 오프셋합니다.\n\n사용 시기: 여러 팀원이 같은 공유 개발 데이터베이스에서 별도의 테스트 데이터셋이 필요할 때.\n\n## 안전하게 실패\n\n영향받는 테이블에 레코드가 있으면 아무것도 쓰지 않고 중단합니다.\n\n## 기존 항목 건너뛰기\n\n기본 키가 대상에 이미 존재하는 레코드를 조용히 건너뜁니다.\nPostgreSQL: ON CONFLICT DO NOTHING; MySQL: INSERT IGNORE; SQLite: INSERT OR IGNORE.
help.topic.environments.body=# 환경\n\n환경은 데이터베이스 연결을 위한 명명된 논리적 그룹입니다. 예: prod, staging, local, ci.\n\nRecordRelay 사용에 환경이 필요하지 않습니다 — 선택 사항입니다.\n\n## 만드는 방법\n\n사이드바에서 '환경'을 엽니다. '추가…'를 클릭하고 이름과 선택적 설명을 입력한 후 확인을 클릭합니다.
help.topic.connections.body=# 연결\n\n연결은 데이터베이스에 접근하기 위한 자격 증명과 네트워크 설정 세트입니다. 클론하려면 최소 두 개의 연결이 필요합니다.\n\n## 연결 추가\n\n'추가…'를 클릭합니다. 입력:\n• 이름: 짧은 레이블\n• 유형: 데이터베이스 엔진\n• 호스트, 포트, 데이터베이스\n• 사용자 및 비밀번호\n\n## 연결 테스트\n\n행을 선택하고 '연결 테스트'를 클릭합니다.
help.topic.discovery.body=# 디스커버리\n\n쿼리 없이 연결된 데이터베이스의 테이블과 열 구조를 탐색할 수 있습니다.\n\n## 사용 방법\n\n• 드롭다운에서 연결 선택\n• 데이터베이스 선택\n• 테이블 선택\n• '열 검사' 클릭\n\n오른쪽 패널에 모든 열이 표시됩니다: 이름, 데이터 유형, NULL 허용 여부, 기본 키 여부.
help.topic.monitor.body=# 모니터 / 대시보드\n\n현재 애플리케이션 세션 중에 일어난 일을 보여줍니다.\n\n## 클론 기록\n\n각 행은 클론 작업을 나타냅니다: 테이블, 레코드 ID, 소스, 대상, 전송된 레코드 수, 기간, 결과.\n\n## KPI 카드\n\n상단에 요약 카운터가 표시됩니다.\n\n## 연결 상태\n\n하단 패널에서 모든 연결에 핑을 보낼 수 있습니다. '상태 확인'을 클릭합니다.\n\n참고: 기록은 현재 세션에만 유지됩니다.
help.topic.graph-view.body=# 그래프 뷰\n\n데이터베이스의 테이블 간 외래 키 관계를 ERD 스타일 다이어그램으로 시각화합니다.\n\n## 사용 방법\n\n• 연결 선택\n• 드롭다운에서 루트 테이블 선택\n• '디스커버' 클릭\n\n## 탐색\n\n• 노드에 마우스 오버: 관련 엣지 강조 표시\n• 줌: 슬라이더, +/- 버튼, 또는 Ctrl+스크롤\n• 화면에 맞춤: 줌 재설정\n\n## 엣지 유형\n\n실선 곡선 = 확인된 FK 제약 조건.\n점선 곡선 = 열 이름 패턴으로 감지된 휴리스틱 링크.
help.topic.migration-drift.body=# 마이그레이션 드리프트\n\n두 데이터베이스의 스키마를 비교하고 차이점을 보고합니다.\n\n## 사용 방법\n\n• 소스 연결 및 데이터베이스 선택\n• 대상 연결 및 데이터베이스 선택\n• '분석' 클릭\n\n차이 유형:\n• 누락된 테이블 (빨간색)\n• 추가 테이블 (노란색)\n• 누락된 열 (빨간색)\n• 추가 열 (노란색)\n• 유형 불일치 (파란색)\n\n## SQL 패치 스크립트\n\n대상을 소스에 맞추기 위한 ALTER TABLE / CREATE TABLE 스크립트를 생성합니다.
help.topic.row-count-diff.body=# 행 수 차이\n\n두 데이터베이스의 각 테이블 행 수를 비교합니다.\n\n## 결과 읽기\n\n• 동기화: 두 데이터베이스에서 이 테이블의 행 수가 같음\n• 대상 지연: 대상이 소스보다 행이 적음\n• 대상 앞섬: 대상이 소스보다 행이 많음\n\n차이 열은 정확한 차이를 보여줍니다.
help.topic.query-analyzer.body=# 쿼리 분석기\n\n연결된 데이터베이스를 쿼리할 수 있습니다. 두 가지 모드:\n\n## 플로우 모드 (기본값)\n\n시각적 쿼리 빌더. 왼쪽 패널에서 테이블을 더블 클릭하여 추가. 포트 버튼을 클릭하여 JOIN 시작. SELECT용 열 체크.\n\n## SQL 모드\n\n수동 작성 쿼리용 텍스트 편집기.
help.topic.connection-health.body=# 연결 상태\n\n저장된 모든 연결에 핑을 보내고 보고합니다:\n• 상태: 정상, 저하, 또는 다운\n• 지연: 밀리초 단위 왕복 시간\n• 세부 정보: 연결 실패 시 오류 메시지\n\n'모두 테스트'를 클릭하여 확인을 실행합니다.
help.topic.masking-coverage.body=# 마스킹 범위\n\n스키마에서 개인정보를 포함할 수 있는 열을 스캔하고 어떤 열이 보호되는지 보여줍니다.\n\n## 감지된 열 범주\n\n• 이메일\n• 전화번호\n• 주소\n• IBAN\n• 국가 ID\n\n## 결과 읽기\n\n초록색 = 개인정보 마스킹 활성화로 클론 시 이 열은 마스킹됩니다.\n빨간색 = 열이 개인정보처럼 보이지만 마스킹 규칙에 포함되지 않습니다.
help.topic.presets.body=# 클론 프리셋\n\n자주 사용하는 클론 구성을 저장하여 클릭 한 번으로 실행합니다.\n\n## 프리셋 저장\n\n양식 작성: 이름, 연결, 엔티티, 깊이. '프리셋 저장' 클릭.\n\n## 프리셋 실행\n\n저장된 프리셋을 선택하고 '지금 실행'을 클릭합니다.
help.topic.scheduled-sync.body=# 예약 동기화\n\n일정에 따라 자동으로 실행되거나 수동으로 트리거할 수 있는 반복 클론 작업을 정의합니다.\n\n## 동기화 설정\n\n이름, 엔티티, 연결, 깊이를 입력합니다. 일정 설정:\n• Cron 표현식: 표준 5필드 cron\n• 간격 (분): N분마다 실행\n\n수동 전용 실행은 둘 다 비워둡니다.\n\n## 수동 실행\n\n목록에서 동기화를 선택하고 언제든지 '지금 실행'을 클릭합니다.
help.topic.faq.body=# 자주 묻는 질문\n\n## 깊이란 무엇인가요?\n\n관련 테이블을 몇 레벨까지 따라가는지 제어합니다. 3으로 시작하세요.\n\n## 대상의 기본 키는 어떻게 되나요?\n\n기본 'ID 재생성' 전략으로 클론된 모든 레코드는 새 기본 키를 받습니다.\n\n## 데이터를 덮어쓰지 않고 클론할 수 있나요?\n\n네. '충돌 시'를 '기존 항목 건너뛰기'로 설정하세요.\n\n## .rrpkg 파일이란 무엇인가요?\n\n클론된 모든 레코드를 포함하는 이동식 패키지 파일 (ZIP 아카이브)입니다.\n\n## 마스킹이 소스 데이터를 변경하나요?\n\n아니요. 대상에 쓰인 데이터만 영향을 받습니다.\n\n## 다른 데이터베이스 엔진 간에 클론할 수 있나요?\n\n네, 스키마가 호환 가능하다면.
