help.topic.faq.title=Perguntas frequentes
help.topic.getting-started.body=# Primeiros passos\n\nRecordRelay copia um único registro de banco de dados — e cada registro relacionado — de um banco de dados para outro. Não é uma ferramenta ETL. Pense como uma forma de reproduzir um cliente, pedido ou caso específico da produção em seu ambiente local em minutos.\n\n## Adicione suas conexões primeiro\n\nAbra Conexões na barra lateral. Clique em Adicionar… e preencha host, porta, nome do banco de dados e credenciais.\n\n## Criar ambientes (opcional)\n\nAmbientes são grupos nomeados como "prod", "staging", "local". Abra Ambientes e clique em Adicionar… para criá-los.\n\n## Clonar seu primeiro registro\n\nAbra Clone Context na barra lateral. Siga os quatro passos:\n• Passo 1: escolher conexão de origem e destino\n• Passo 2: selecionar tabela raiz e inserir ID do registro\n• Passo 3: definir profundidade (3 é um bom ponto de partida)\n• Passo 4: substituir opcionalmente valores de campos\n\nClique em Clonar contexto e observe o log.
help.topic.clone-context.body=# Contexto de clonagem\n\nA tela principal. Copia um registro e todos os registros conectados de um banco de dados de origem para um de destino.\n\n## Passo 1 — Selecionar conexões\n\nOrigem: o banco de dados para ler.\nDestino: o banco de dados para escrever.\n\n## Passo 2 — Tabela e registro\n\nTabela raiz: a tabela onde seu registro está. Detectar: analisa relações FK para sugerir as tabelas raiz mais prováveis.\n\n## Passo 3 — Opções\n\nProfundidade de relação: quantos níveis de tabelas relacionadas seguir. Começar com 3.\nMascarar dados pessoais: substitui dados pessoais por valores fictícios realistas.\nEm conflito: o que fazer quando o destino já tem dados.\n\n## Passo 4 — Substituições de campos\n\nPermite alterar valores de colunas específicas durante a clonagem.\n\n## Botão Visualizar\n\nExecuta sem escrever nada. Mostra quais tabelas e quantas linhas seriam copiadas.
help.topic.conflict-resolution.body=# Resolução de conflitos\n\nQuando RecordRelay escreve em um destino com dados existentes, precisa de uma estratégia. A caixa "Em conflito" oferece quatro opções.\n\n## Regenerar identidades (padrão — recomendado)\n\nAtribui novas chaves primárias a cada registro clonado e atualiza todas as chaves estrangeiras.\n\nQuando usar: quase sempre.\n\n## Isolar espaço de nomes\n\nDesloca todos os IDs para um intervalo numérico separado.\n\nQuando usar: quando vários membros da equipe precisam de conjuntos de dados separados.\n\n## Falhar com segurança\n\nAborta antes de escrever se alguma tabela afetada já tiver registros.\n\n## Pular existentes\n\nIgnora silenciosamente registros cuja chave primária já existe no destino.\nPostgreSQL: ON CONFLICT DO NOTHING; MySQL: INSERT IGNORE; SQLite: INSERT OR IGNORE.
help.topic.environments.body=# Ambientes\n\nAmbientes são grupos lógicos nomeados para suas conexões de banco de dados. Exemplos: prod, staging, local, ci.\n\nNão são necessários para usar RecordRelay — são opcionais.\n\n## Como criar um\n\nAbra Ambientes na barra lateral. Clique em Adicionar…, dê um nome e descrição opcional, depois OK.
help.topic.connections.body=# Conexões\n\nUma conexão é um conjunto de credenciais e configurações de rede. São necessárias pelo menos duas conexões para clonar.\n\n## Adicionar uma conexão\n\nClique em Adicionar…. Preencha:\n• Nome: rótulo curto\n• Tipo: motor de banco de dados\n• Host, Porta, Banco de dados\n• Usuário e Senha\n\n## Testar uma conexão\n\nSelecione uma linha e clique em Testar conexão.
help.topic.discovery.body=# Descoberta\n\nPermite explorar a estrutura de tabelas e colunas de qualquer banco de dados conectado.\n\n## Como usar\n\n• Selecionar uma conexão\n• Selecionar um banco de dados\n• Selecionar uma tabela\n• Clicar em Inspecionar colunas\n\nO painel direito mostra todas as colunas com nome, tipo, nulabilidade e se é chave primária.
help.topic.monitor.body=# Monitor / Painel\n\nMostra o que aconteceu durante a sessão atual.\n\n## Histórico de clonagem\n\nCada linha representa uma operação de clonagem com tabela, ID, origem, destino, registros, duração e resultado.\n\n## Cartões KPI\n\nContadores resumo no topo.\n\n## Saúde das conexões\n\nO painel inferior permite fazer ping em todas as conexões. Clique em Verificar saúde.\n\nNota: o histórico é apenas para a sessão atual.
help.topic.graph-view.body=# Visualização de grafo\n\nVisualiza as relações de chave estrangeira entre tabelas como um diagrama ERD.\n\n## Como usar\n\n• Selecionar uma conexão\n• Escolher tabela raiz\n• Clicar em Descobrir\n\n## Navegação\n\n• Passar sobre nó: destaca relações\n• Zoom: controle deslizante ou Ctrl+Rolar\n• Ajustar à tela: redefine zoom\n\n## Tipos de arestas\n\nCurvas sólidas = restrições FK confirmadas.\nCurvas tracejadas = links heurísticos por padrões de nomes.
help.topic.migration-drift.body=# Deriva de migração\n\nCompara o esquema de dois bancos de dados e relata diferenças.\n\n## Como usar\n\n• Selecionar origem e banco de dados\n• Selecionar destino e banco de dados\n• Clicar em Analisar\n\nTipos de diferenças:\n• Tabela ausente (vermelho)\n• Tabela extra (amarelo)\n• Coluna ausente (vermelho)\n• Coluna extra (amarelo)\n• Tipo incompatível (azul)\n\n## Script SQL Patch\n\nGera ALTER TABLE / CREATE TABLE para alinhar o destino à origem.
help.topic.row-count-diff.body=# Diferença de linhas\n\nCompara o número de linhas em cada tabela entre dois bancos de dados.\n\n## Lendo os resultados\n\n• Sincronizado: ambos têm o mesmo número de linhas\n• Destino atrás: destino tem menos linhas\n• Destino à frente: destino tem mais linhas\n\nA coluna Diferença mostra o valor exato.
help.topic.query-analyzer.body=# Analisador de consultas\n\nPermite consultar qualquer banco de dados conectado. Dois modos:\n\n## Modo fluxo (padrão)\n\nConstrutor visual de consultas. Duplo clique em tabela para adicionar. Clique no porto para iniciar JOIN. Marcar colunas para SELECT.\n\n## Modo SQL\n\nEditor de texto para consultas escritas manualmente.
help.topic.connection-health.body=# Saúde das conexões\n\nFaz ping em todas as conexões salvas e relata:\n• Status: OK, Degradado ou Inativo\n• Latência: tempo de ida e volta em milissegundos\n• Detalhe: mensagem de erro se a conexão falhou\n\nClique em Testar tudo para executar a verificação.
help.topic.masking-coverage.body=# Cobertura de mascaramento\n\nVerifica seu esquema em busca de colunas que possam conter dados pessoais e mostra quais estão cobertas.\n\n## Categorias detectadas\n\n• EMAIL\n• TELEFONE\n• ENDEREÇO\n• IBAN\n• ID NACIONAL\n\n## Lendo os resultados\n\nVerde = coluna será mascarada ao clonar com dados pessoais habilitado.\nVermelho = coluna parece dados pessoais mas não está coberta.
help.topic.presets.body=# Modelos de clonagem\n\nSalva configurações de clonagem frequentes para executá-las com um clique.\n\n## Salvar um modelo\n\nPreencher o formulário: nome, conexões, entidade, profundidade. Clicar em Salvar modelo.\n\n## Executar um modelo\n\nSelecionar um modelo salvo e clicar em Executar agora.
help.topic.scheduled-sync.body=# Sincronização agendada\n\nDefine trabalhos de clonagem recorrentes que são executados automaticamente ou manualmente.\n\n## Configurar uma sincronização\n\nPreencher nome, entidade, conexões e profundidade. Definir um agendamento:\n• Expressão Cron: cron padrão de 5 campos\n• Intervalo (minutos): executar a cada N minutos\n\nDeixar ambos em branco para execução apenas manual.\n\n## Executar manualmente\n\nSelecionar uma sincronização e clicar em Executar agora.
help.topic.faq.body=# Perguntas frequentes\n\n## O que é profundidade?\n\nControla quantos níveis de tabelas relacionadas são seguidos. Começar com 3.\n\n## O que acontece com as chaves primárias?\n\nCom Regenerar identidades, cada registro clonado recebe uma nova chave primária.\n\n## Posso clonar sem sobrescrever dados?\n\nSim. Definir Em conflito como Pular existentes.\n\n## O que é um arquivo .rrpkg?\n\nUm arquivo de pacote portátil (ZIP) contendo todos os registros clonados.\n\n## O mascaramento modifica os dados de origem?\n\nNão. Apenas os dados escritos no destino são afetados.\n\n## Posso clonar entre diferentes motores de banco de dados?\n\nSim, se os esquemas forem compatíveis.
