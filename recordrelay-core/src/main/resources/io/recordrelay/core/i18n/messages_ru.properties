help.topic.faq.title=Часто задаваемые вопросы
help.topic.getting-started.body=# Начало работы\n\nRecordRelay копирует одну запись базы данных — и все связанные записи — из одной базы данных в другую. Это не ETL-инструмент. Думайте о нём как о способе воспроизвести конкретного клиента, заказ или дело из продакшена в вашей локальной среде за несколько минут.\n\n## Сначала добавьте подключения\n\nОткройте Подключения на боковой панели. Нажмите Добавить… и введите хост, порт, имя базы данных и учётные данные.\n\n## Создайте окружения (необязательно)\n\nОкружения — именованные группы, такие как "prod", "staging", "local". Откройте Окружения и нажмите Добавить… для их создания.\n\n## Клонируйте первую запись\n\nОткройте Clone Context на боковой панели. Следуйте четырём шагам:\n• Шаг 1: выберите исходное и целевое подключение\n• Шаг 2: выберите корневую таблицу и введите ID записи\n• Шаг 3: установите глубину (3 — хорошая отправная точка)\n• Шаг 4: при необходимости переопределите значения полей\n\nНажмите Клонировать контекст и наблюдайте за логом.
help.topic.clone-context.body=# Контекст клонирования\n\nГлавный экран. Копирует одну запись и все связанные записи из исходной базы данных в целевую.\n\n## Шаг 1 — Выбор подключений\n\nИсточник: база данных для чтения.\nНазначение: база данных для записи.\n\n## Шаг 2 — Таблица и запись\n\nКорневая таблица: таблица, где находится ваша запись. Обнаружить: анализирует FK-связи для предложения наиболее вероятных корневых таблиц.\n\n## Шаг 3 — Параметры\n\nГлубина связей: сколько уровней связанных таблиц следовать. Начните с 3.\nМаскировать персональные данные: заменяет личные данные реалистичными фиктивными значениями.\nПри конфликте: что делать, когда цель уже содержит данные.\n\n## Шаг 4 — Переопределения полей\n\nПозволяет изменить значения конкретных столбцов во время клонирования.\n\n## Кнопка Предварительный просмотр\n\nВыполняет пробный запуск без записи. Показывает, какие таблицы и сколько строк будут скопированы.
help.topic.conflict-resolution.body=# Разрешение конфликтов\n\nКогда RecordRelay записывает в цель с существующими данными, ему нужна стратегия. Поле "При конфликте" предлагает четыре варианта.\n\n## Перегенерировать идентификаторы (по умолчанию — рекомендуется)\n\nНазначает новые первичные ключи каждой клонированной записи и обновляет все внешние ключи.\n\nКогда использовать: почти всегда.\n\n## Изолировать пространство имён\n\nСмещает все ID в отдельный числовой диапазон.\n\nКогда использовать: когда нескольким членам команды нужны отдельные наборы тестовых данных.\n\n## Безопасный сбой\n\nОтменяет до записи, если затронутая таблица уже содержит записи.\n\n## Пропустить существующие\n\nТихо пропускает записи, чей первичный ключ уже существует в цели.\nPostgreSQL: ON CONFLICT DO NOTHING; MySQL: INSERT IGNORE; SQLite: INSERT OR IGNORE.
help.topic.environments.body=# Окружения\n\nОкружения — именованные логические группы для подключений к базам данных. Примеры: prod, staging, local, ci.\n\nОни не обязательны для работы с RecordRelay.\n\n## Как создать окружение\n\nОткройте Окружения на боковой панели. Нажмите Добавить…, дайте имя и необязательное описание, затем ОК.
help.topic.connections.body=# Подключения\n\nПодключение — набор учётных данных и сетевых настроек. Для клонирования нужны минимум два подключения.\n\n## Добавить подключение\n\nНажмите Добавить…. Заполните:\n• Имя: короткая метка\n• Тип: движок базы данных\n• Хост, Порт, База данных\n• Пользователь и Пароль\n\n## Проверить подключение\n\nВыберите строку и нажмите Проверить подключение.
help.topic.discovery.body=# Обнаружение\n\nПозволяет просматривать структуру таблиц и столбцов любой подключённой базы данных.\n\n## Как использовать\n\n• Выбрать подключение\n• Выбрать базу данных\n• Выбрать таблицу\n• Нажать Проверить столбцы\n\nПравая панель показывает все столбцы с именем, типом, допустимостью NULL и является ли первичным ключом.
help.topic.monitor.body=# Монитор / Панель управления\n\nПоказывает, что произошло за текущую сессию.\n\n## История клонирования\n\nКаждая строка представляет операцию клонирования с таблицей, ID, источником, назначением, записями, длительностью и результатом.\n\n## Карточки KPI\n\nСводные счётчики наверху.\n\n## Состояние подключений\n\nНижняя панель позволяет пинговать все подключения. Нажмите Проверить состояние.\n\nПримечание: история сохраняется только для текущей сессии.
help.topic.graph-view.body=# Граф-представление\n\nВизуализирует связи внешних ключей между таблицами в виде ERD-диаграммы.\n\n## Как использовать\n\n• Выбрать подключение\n• Выбрать корневую таблицу\n• Нажать Обнаружить\n\n## Навигация\n\n• Наведите на узел: выделяет связи\n• Масштаб: ползунок или Ctrl+Прокрутка\n• По размеру экрана: сбрасывает масштаб\n\n## Типы рёбер\n\nСплошные кривые = подтверждённые ограничения FK.\nПунктирные кривые = эвристические ссылки по шаблонам имён.
help.topic.migration-drift.body=# Дрейф миграции\n\nСравнивает схему двух баз данных и сообщает о различиях.\n\n## Как использовать\n\n• Выбрать исходное подключение и базу данных\n• Выбрать целевое подключение и базу данных\n• Нажать Анализировать\n\nТипы различий:\n• Отсутствующая таблица (красный)\n• Лишняя таблица (жёлтый)\n• Отсутствующий столбец (красный)\n• Лишний столбец (жёлтый)\n• Несовпадение типов (синий)\n\n## SQL-патч скрипт\n\nГенерирует ALTER TABLE / CREATE TABLE для синхронизации цели с источником.
help.topic.row-count-diff.body=# Разница строк\n\nСравнивает количество строк в каждой таблице между двумя базами данных.\n\n## Чтение результатов\n\n• Синхронизировано: обе базы имеют одинаковое количество строк\n• Цель отстаёт: в цели меньше строк\n• Цель опережает: в цели больше строк\n\nСтолбец Разница показывает точное значение.
help.topic.query-analyzer.body=# Анализатор запросов\n\nПозволяет запрашивать любую подключённую базу данных. Два режима:\n\n## Режим потока (по умолчанию)\n\nВизуальный конструктор запросов. Дважды кликните таблицу для добавления. Кликните порт для JOIN. Отметьте столбцы для SELECT.\n\n## Режим SQL\n\nТекстовый редактор для рукописных запросов.
help.topic.connection-health.body=# Состояние подключений\n\nПингует все сохранённые подключения и сообщает:\n• Статус: ОК, Деградировано или Недоступно\n• Задержка: время туда-обратно в миллисекундах\n• Детали: сообщение об ошибке при неудаче\n\nНажмите Проверить все для запуска проверки.
help.topic.masking-coverage.body=# Покрытие маскирования\n\nСканирует схему на наличие столбцов, содержащих персональные данные, и показывает, какие из них защищены.\n\n## Обнаруженные категории\n\n• ЭЛЕКТРОННАЯ ПОЧТА\n• ТЕЛЕФОН\n• АДРЕС\n• IBAN\n• НАЦИОНАЛЬНЫЙ ID\n\n## Чтение результатов\n\nЗелёный = столбец будет замаскирован при клонировании с маскированием.\nКрасный = столбец похож на персональные данные, но не защищён.
help.topic.presets.body=# Шаблоны клонирования\n\nСохраняет часто используемые конфигурации клонирования для запуска одним кликом.\n\n## Сохранить шаблон\n\nЗаполнить форму: имя, подключения, сущность, глубина. Нажать Сохранить шаблон.\n\n## Запустить шаблон\n\nВыбрать сохранённый шаблон и нажать Запустить сейчас.
help.topic.scheduled-sync.body=# Плановая синхронизация\n\nОпределяет повторяющиеся задания клонирования, выполняемые автоматически или вручную.\n\n## Настройка синхронизации\n\nЗаполнить имя, сущность, подключения и глубину. Установить расписание:\n• Выражение Cron: стандартный 5-польный cron\n• Интервал (минут): запуск каждые N минут\n\nОставить оба пустыми для только ручного запуска.\n\n## Запуск вручную\n\nВыбрать синхронизацию и нажать Запустить сейчас.
help.topic.faq.body=# Часто задаваемые вопросы\n\n## Что такое глубина?\n\nКонтролирует, сколько уровней связанных таблиц отслеживается. Начать с 3.\n\n## Что происходит с первичными ключами?\n\nС Перегенерировать идентификаторы каждая клонированная запись получает новый первичный ключ.\n\n## Можно ли клонировать без перезаписи данных?\n\nДа. Установить При конфликте на Пропустить существующие.\n\n## Что такое файл .rrpkg?\n\nПереносимый файл пакета (ZIP) со всеми клонированными записями.\n\n## Изменяет ли маскирование исходные данные?\n\nНет. Затрагиваются только данные, записанные в цель.\n\n## Можно ли клонировать между разными движками баз данных?\n\nДа, если схемы совместимы.
