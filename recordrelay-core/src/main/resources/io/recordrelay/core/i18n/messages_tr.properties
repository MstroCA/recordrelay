# Yardım konu içerikleri
help.topic.getting-started.body=# Başlarken\n\nRecordRelay, bir veritabanı kaydını ve o kayıtla ilişkili tüm diğer kayıtları bir veritabanından diğerine kopyalar. ETL aracı değildir. Düşünün ki production'daki belirli bir müşteriyi, siparişi veya beyanı — bağlı tüm tablolarıyla birlikte — yerel ortamınıza dakikalar içinde taşıyabilirsiniz.\n\n## Önce bağlantılarınızı ekleyin\n\nSol menüden Bağlantılar'ı açın. Ekle… butonuna tıklayıp her veritabanı için host, port, veritabanı adı ve kimlik bilgilerini girin (örneğin: prod-db ve local-db).\n\n## Ortam oluşturun (isteğe bağlı)\n\nOrtamlar, "prod", "staging", "local" gibi bağlantıları gruplamak için kullanılır. Ortamlar ekranından Ekle… ile oluşturabilirsiniz. Zorunlu değildir ama bağlantı açılır listelerini daha okunaklı hale getirir.\n\n## İlk klonlama işleminizi yapın\n\nSol menüdeki mavi Klonlama butonunu açın. Dört adımı takip edin:\n• Adım 1: kaynak ve hedef bağlantıyı seçin\n• Adım 2: başlangıç tablosunu seçin ve kayıt ID'sini girin\n• Adım 3: derinliği ayarlayın (3 iyi bir başlangıç noktasıdır) ve çakışma çözümünü varsayılanda bırakın\n• Adım 4: gerekirse hedef ortamda bazı alan değerlerini değiştirin\n\nContext Kopyala butonuna tıklayın ve logu izleyin.

help.topic.clone-context.body=# Klonlama (Clone Context)\n\nAna ekran. Bir kaydı ve bağlı tüm kayıtları kaynak veritabanından hedef veritabanına kopyalar.\n\n## Adım 1 — Bağlantı seç\n\nSource (Kaynak): okunacak veritabanı (örn. production).\nTarget (Hedef): yazılacak veritabanı (örn. local).\n\nExport modu onay kutusu: hedefe yazmak yerine her şeyi bir .rrpkg dosyasına kaydeder, meslektaşlarınızla paylaşabilirsiniz.\n\n## Adım 2 — Tablo & Kayıt\n\nBaşlangıç Tablosu: kaydınızın bulunduğu tablo (örn. orders, customers, beyanname). Kaynak bağlantı seçildiğinde açılır liste otomatik dolar.\n\nTespit Et butonu: yabancı anahtar (FK) ilişkilerini analiz ederek en olası başlangıç tablolarını önerir.\n\nPrimary Key Kolonu: her satırı benzersiz olarak tanımlayan kolon (neredeyse her zaman id'dir).\n\nKayıt ID'si: klonlamak istediğiniz kaydın PK değeri (örn. 125).\n\n## Adım 3 — Seçenekler\n\nİlişki derinliği: kaç seviye bağlı tablo takip edileceği. Derinlik 1 = yalnızca kök kayıt. Derinlik 2 = kök + doğrudan çocuklar. Derinlik 3 = kök + çocuklar + torunlar. 3 ile başlayın.\n\nPII Maskele: e-posta, telefon, adres, IBAN ve TC kimlik numarası gibi kişisel verileri gerçekçi sahte değerlerle değiştirir. Maskeleme deterministiktir — aynı kaynak değer her zaman aynı maskelenmiş çıktıyı üretir.\n\nÇakışma çözümü: hedef zaten veri içerdiğinde ne yapılacağı. Detaylar için Çakışma Çözümü konusuna bakın.\n\n## Adım 4 — Alan Değiştirme\n\nKlonlama sırasında belirli kolon değerlerini değiştirmenizi sağlar. Örnek: created_by alanını bir test kullanıcısına ayarlayın; böylece klonlanan kayıtlar gerçek bir kullanıcıya aitmiş gibi görünmez. Tablo kolonu boş bırakılırsa tüm tablolara uygulanır.\n\n## Önizle butonu\n\nHiçbir şey yazmadan deneme çalıştırması (dry run) yapar. Hangi tablolardan kaç satır kopyalanacağını gösterir. Klonlamadan önce kapsamı doğrulamak için kullanın.

help.topic.conflict-resolution.body=# Çakışma Çözümü\n\nRecordRelay, zaten veri içeren bir hedef veritabanına kayıt yazdığında çakışmaları nasıl ele alacağını bilmesi gerekir. Clone Context ekranındaki Adım 3'te bulunan "Çakışma çözümü" açılır listesi dört seçenek sunar.\n\n## Yeni Kimlik Ata — Varsayılan, önerilen\n\nKlonlanan her kayda yeni bir birincil anahtar atanır ve tüm yabancı anahtarlar buna göre güncellenir. Yazma işleminden sonra veritabanı dizileri en yüksek atanan ID'nin ötesine taşınır; böylece uygulamanın kendi eklemeleri klonlanan kayıtlarla çakışmaz.\n\nNe zaman kullanılır: neredeyse her zaman. Hedef boş olsun ya da olmasın en güvenli seçenektir.\n\n## Ad Alanında İzole Et\n\nTüm ID'leri ayrı bir sayısal aralığa kaydırır; böylece birden fazla klonlanmış bağlam aynı hedef şemada birbirini etkilemeden bir arada bulunabilir.\n\nNe zaman kullanılır: birden fazla ekip üyesinin aynı paylaşımlı geliştirme veritabanında eş zamanlı, ayrı test veri setlerine ihtiyaç duyduğu durumlarda.\n\n## Çakışmada Dur\n\nEtkilenen tablolardan herhangi birinde hedefte kayıt varsa tek bir satır bile yazmadan iptal eder. Çakışma tespit edildiğinde hiçbir şey yazılmaz.\n\nNe zaman kullanılır: otomatik test pipeline'ları veya her çalıştırmada veritabanının sıfırlandığı ilk ortam kurulum scriptleri; eski verinin sessizce yeni klonla karışmaması için kesin bir garanti istediğinizde.\n\n## Mevcutu Atla\n\nBirincil anahtarı hedefte zaten var olan kayıtları sessizce atlar. Mevcut kayıtlar güncellenmez.\nPostgreSQL'de ON CONFLICT DO NOTHING, MySQL'de INSERT IGNORE, SQLite'da INSERT OR IGNORE olarak çevrilir.\n\nNe zaman kullanılır: daha önce klonlanmış veriyi yenilerken — dün klonladığınız müşteriye yeni siparişler eklenmiş ve siz yalnızca eksik kayıtları eklemek istiyorsunuz, hedefte halihazırda olanları bozmadan.

help.topic.environments.body=# Ortamlar\n\nOrtamlar, veritabanı bağlantılarınız için mantıksal gruplardır. Örnekler: prod, staging, local, ci.\n\nRecordRelay'i kullanmak için ortamlara ihtiyacınız yoktur — isteğe bağlıdır. Ancak çok sayıda bağlantınız olduğunda açılır listeleri daha okunaklı hale getirirler.\n\n## Nasıl oluşturulur\n\nSol menüden Ortamlar'ı açın. Ekle… butonuna tıklayıp bir ad (örn. local) ve isteğe bağlı açıklama girerek Tamam'a tıklayın.\n\nBağlantılar, Bağlantılar ekranından ortamlara atanır.

help.topic.connections.body=# Bağlantılar\n\nBir bağlantı, RecordRelay'e bir veritabanına nasıl ulaşacağını söyleyen kimlik bilgileri ve ağ ayarları kümesidir. Klonlama yapabilmek için en az iki bağlantı (kaynak ve hedef) eklemeniz gerekir.\n\n## Bağlantı ekleme\n\nEkle… butonuna tıklayın. Doldurun:\n• Ad: açılır listelerde göreceğiniz kısa etiket (örn. prod-katv, local-dev)\n• Tip: veritabanı motoru (PostgreSQL, MySQL vb.)\n• Host, Port, Veritabanı: ağ adresi ve veritabanı adı\n• Kullanıcı ve Şifre: kimlik bilgileri\n\n## Bağlantıyı test etme\n\nBir satır seçip Bağlantıyı Test Et butonuna tıklayın. RecordRelay kısa bir bağlantı açar ve gecikmeyi veya hata nedenini raporlar.

help.topic.discovery.body=# Şema Keşfi\n\nHerhangi bir bağlı veritabanının tablo ve kolon yapısına sorgu yazmadan göz atmanızı sağlar.\n\n## Nasıl kullanılır\n\n• Açılır listeden bir bağlantı seçin\n• Bir veritabanı seçin\n• Bir tablo seçin\n• Kolonları İncele butonuna tıklayın\n\nSağ panel tüm kolonları gösterir: ad, veri tipi, NULL'a izin verilip verilmediği ve birincil anahtar olup olmadığı.\n\nKlonlama yapmadan önce başlangıç tablosu adını veya birincil anahtar kolonunu bulmak için kullanışlıdır.

help.topic.monitor.body=# İzleme / Kontrol Paneli\n\nGeçerli uygulama oturumunda neler olduğunu gösterir.\n\n## Kopyalama geçmişi\n\nHer satır bir klonlama işlemini temsil eder: tablo, kayıt ID'si, kaynak, hedef, aktarılan kayıt sayısı, süre ve sonuç.\n\n## KPI kartları\n\nÜstte özet sayaçlar gösterilir: toplam aktarılan kayıt, işlem sayısı, başarısız işlem ve son işlemin süresi.\n\n## Bağlantı sağlığı\n\nAlt panel, tüm yapılandırılmış bağlantıları ping atmak için kullanılır. Sağlık Kontrol butonuna tıklayarak testi çalıştırın.\n\nNot: geçmiş yalnızca geçerli oturum için tutulur; uygulama yeniden başlatıldığında sıfırlanır.

help.topic.graph-view.body=# Graf Görünümü\n\nVeritabanınızdaki tablolar arasındaki yabancı anahtar ilişkilerini ERD tarzı diyagram olarak görselleştirir.\n\n## Nasıl kullanılır\n\n• Bir bağlantı seçin\n• Açılır listeden kök tablo seçin\n• Keşfet butonuna tıklayın\n\nDiyagram seçilen tabloyu merkeze yerleştirir; ilişkili tablolara çizgiler çizer ve onlardan da başka tablolara çizgiler devam eder.\n\n## Gezinme\n\n• Bir düğümün üzerine gelin: ilgisiz kenarlar solar, tek bir ilişkiyi takip edebilirsiniz\n• Zoom: kaydırıcı, +/− butonları veya Ctrl+Kaydır\n• Ekrana Sığdır: zoom'u sıfırlar ve grafı ortalar\n\n## Kenar türleri\n\nKatı eğriler = veritabanı şemasındaki doğrulanmış yabancı anahtar kısıtlamaları.\nKesik eğriler = kolon adlandırma kalıplarından algılanan sezgisel bağlantılar (örn. order_id adlı bir kolon orders tablosuna işaret ediyor).

help.topic.migration-drift.body=# Şema Karşılaştırma\n\nİki veritabanının şemasını (tablo ve kolon yapısı) karşılaştırır ve farklılıkları raporlar. Eksik migration'ları yakalamak için kullanışlıdır.\n\n## Nasıl kullanılır\n\n• Kaynak bağlantı ve veritabanını seçin\n• Hedef bağlantı ve veritabanını seçin\n• Analiz Et butonuna tıklayın\n\nSonuç tablosu her farkı renk kodlu türüyle gösterir:\n• Eksik Tablo (kırmızı): tablo kaynakta var ama hedefte yok\n• Fazla Tablo (sarı): tablo hedefte var ama kaynakta yok\n• Eksik Kolon (kırmızı): kolon kaynak tabloda var ama hedef tabloda yok\n• Fazla Kolon (sarı): kolon hedefte var ama kaynakta yok\n• Tip Uyuşmazlığı (mavi): kolon her ikisinde de var ama farklı veri tipinde\n\n## SQL Patch Script\n\nSQL Üret butonu, hedefi kaynakla hizalamak için çalıştırabileceğiniz bir ALTER TABLE / CREATE TABLE scripti üretir. Güvenli olarak otomatik üretilemeyen ifadeler yorum satırı olarak eklenir.

help.topic.row-count-diff.body=# Satır Sayısı Farkı\n\nİki veritabanındaki her tablonun satır sayısını karşılaştırır. Tek tek kayıtları incelemeden veri sapmasını hızlıca tespit etmenin kolay bir yoludur.\n\n## Sonuçları okumak\n\n• Eşit: her iki veritabanında bu tablo için aynı satır sayısı var\n• Hedef eksik: hedef, kaynaktan daha az satıra sahip\n• Hedef fazla: hedef, kaynaktan daha fazla satıra sahip\n\nFark kolonu tam farkı gösterir (pozitif = hedefte daha fazla, negatif = hedefte daha az).

help.topic.query-analyzer.body=# Sorgu Analizcisi\n\nHerhangi bir bağlı veritabanını sorgulamanızı ve sonuçları görmenizi sağlar. İki mod:\n\n## Akış modu (varsayılan)\n\nGörsel sorgu oluşturucu. Sol panelde bir tabloya çift tıklayarak kanvasa ekleyin. Bir kolondaki port butonuna (○) tıklayarak JOIN başlatın, ardından başka bir tablodaki porta tıklayarak tamamlayın; bir diyalog INNER, LEFT veya RIGHT sorar. SELECT listesine dahil etmek için kolon onay kutularını işaretleyin. Sağ panelde WHERE filtreleri, ORDER BY ve LIMIT ekleyin. SQL önizlemesi canlı güncellenir. Çalıştır butonuna tıklayın.\n\n## SQL modu\n\nEl yazısı sorgular için düz metin editörü. Araç çubuğu butonuyla modlar arasında geçiş yapın. Her iki mod da aynı Çalıştır butonunu ve sonuç tablosunu paylaşır.

help.topic.connection-health.body=# Bağlantı Sağlığı\n\nKayıtlı tüm bağlantılarınıza ping atar ve şunları raporlar:\n• Durum: Tamam, Düşük Performans veya Bağlanamıyor\n• Gecikme: milisaniye cinsinden gidiş-dönüş süresi\n• Detay: bağlantı başarısız olduysa hata mesajı\n\nKontrolü çalıştırmak için Tümünü Test Et butonuna tıklayın. Klonlamaya başlamadan önce hem kaynağın hem hedefin erişilebilir olduğunu doğrulamak için kullanışlıdır.

help.topic.masking-coverage.body=# Maskeleme Kapsamı\n\nŞemanızı KVK içeriyor olabilecek kolonlar için tarar ve hangilerinin maskeleme kurallarıyla kapsandığını gösterir.\n\n## Algılanan kolon kategorileri\n\n• E-POSTA: e-posta adres kolonları\n• TELEFON: telefon numarası kolonları\n• ADRES: adresle ilgili kolonlar\n• IBAN: banka hesap numarası kolonları\n• TC KİMLİK: ulusal kimlik numarası kolonları\n\n## Sonuçları okumak\n\nYeşil = PII Maskele etkin olarak klonlandığında bu kolon maskelenecek.\nKırmızı (açık) = kolon KVK gibi görünüyor ama maskeleme kuralıyla kapsanmıyor.\n\nYalnızca ilgilenilmesi gereken kolonlara odaklanmak için Yalnızca açıkları göster onay kutusunu kullanın.

help.topic.presets.body=# Klonlama Öntanımları\n\nSık kullanılan klonlama yapılandırmalarını kaydederek her seferinde tüm ayarları yeniden girmek yerine tek tıklamayla çalıştırmanızı sağlar.\n\n## Öntanım kaydetme\n\nEkranın altındaki formu doldurun: öntanıma bir ad verin, kaynak/hedef bağlantıları seçin, varlık adı ve ID'si girin, derinliği ayarlayın ve isteğe bağlı olarak alan değişikliklerini yapılandırın. Öntanımı Kaydet butonuna tıklayın.\n\n## Öntanım çalıştırma\n\nListeden kayıtlı bir öntanım seçin ve Şimdi Çalıştır butonuna tıklayın. Log paneli ilerlemeyi gösterir.

help.topic.scheduled-sync.body=# Zamanlanmış Senkronizasyon\n\nBir zamanlamaya göre otomatik olarak çalışan veya manuel tetiklenebilen tekrarlayan klonlama işleri tanımlar.\n\n## Senkronizasyon kurma\n\nAdı, varlığı, bağlantıları ve derinliği öntanımdaki gibi doldurun. Ardından bir zamanlama belirleyin:\n• Cron ifadesi: standart 5 alanlı cron (örn. her Pazartesi 06:00 için 0 6 * * 1)\n• Aralık (dakika): her N dakikada bir çalıştır\n\nYalnızca manuel çalıştırma için her ikisini de boş bırakın.\n\n## Manuel çalıştırma\n\nListeden bir senkronizasyon seçin ve zamanlamadan bağımsız olarak istediğiniz zaman Şimdi Çalıştır butonuna tıklayın.

help.topic.faq.body=# Sık Sorulan Sorular\n\n## Derinlik nedir ve nasıl seçerim?\n\nDerinlik, kaç seviye ilişkili tablonun takip edileceğini kontrol eder. Derinlik 1 = yalnızca kök kayıt. Derinlik 2 = kök + doğrudan çocuklar. Derinlik 3 = kök + çocuklar + torunlar. 3 ile başlayın. Klonlama çok uzun sürüyorsa veya çok fazla veri kopyalanıyorsa azaltın; ilişkili kayıtlar eksikse artırın.\n\n## Hedefte birincil anahtarlara ne olur?\n\nVarsayılan Yeni Kimlik Ata stratejisiyle her klonlanan kayıt yeni bir birincil anahtar alır ve tüm yabancı anahtarlar buna göre güncellenir. Kaynaktaki orijinal ID'ler kullanılmaz. Gelecekteki çakışmaları önlemek için diziler ilerletilir.\n\n## Mevcut veriyi silmeden klonlayabilir miyim?\n\nEvet. Çakışma çözümünü Mevcutu Atla olarak ayarlayın. Birincil anahtarı hedefte zaten var olan kayıtlar sessizce atlanır.\n\n## .rrpkg dosyası nedir?\n\nKlonlanan tüm kayıtları içeren taşınabilir bir paket dosyasıdır (ZIP arşivi). Canlı bir veritabanına yazmak yerine oluşturmak için Clone Context'te Export modunu etkinleştirin. Dosyayı CLI'da rr import ile içe aktarabilecek bir meslektaşınızla paylaşın.\n\n## Maskeleme kaynak veriyi değiştirir mi?\n\nHayır. Maskeleme yalnızca hedefe (veya .rrpkg dosyasına) yazılan veriyi etkiler. Kaynak veritabanı asla değiştirilmez.\n\n## Klonlama tip cast hatasıyla neden başarısız oldu?\n\nBu genellikle PostgreSQL enum kolonlarıyla olur. Hedef veritabanının özel bir enum tipi olarak tanımlanmış bir kolonu olduğu anlamına gelir. RecordRelay bunu 1.0.22 sürümünden itibaren otomatik olarak işler.\n\n## Farklı veritabanı motorları arasında klonlayabilir miyim?\n\nEvet, şemalar uyumluysa. Örneğin PostgreSQL'den MySQL'e klonlayabilirsiniz. Kolon tipi farklılıkları sürücü düzeyinde çözülür.\n\n## Komut satırından nasıl klonlarım?\n\nCLI'yı kurun ve şunu çalıştırın: rr clone --entity orders --id 99 --from prod --target local --depth 3\nTüm seçenekler için docs klasöründeki CLI Referansına bakın.

