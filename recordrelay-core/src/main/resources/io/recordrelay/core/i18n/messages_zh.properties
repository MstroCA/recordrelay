help.topic.getting-started.body=# 快速入门\n\nRecordRelay 将单个数据库记录及其所有关联记录从一个数据库复制到另一个数据库。它不是 ETL 工具，而是一种在几分钟内将生产环境中特定客户、订单或案例复制到本地或测试环境的方法。\n\n## 首先添加连接\n\n从侧边栏打开"连接"。点击"添加…"并填入每个数据库的主机、端口、数据库名称和凭据。\n\n## 创建环境（可选）\n\n环境是命名分组，如"prod"、"staging"、"local"。打开"环境"并点击"添加…"创建它们。\n\n## 克隆第一条记录\n\n从侧边栏打开 Clone Context。按照四个步骤操作：\n• 步骤 1：选择源和目标连接\n• 步骤 2：选择根表并输入记录 ID\n• 步骤 3：设置深度（3 是好的起点）\n• 步骤 4：可选地覆盖字段值\n\n点击"克隆上下文"并观察日志。
help.topic.clone-context.body=# 克隆上下文\n\n主屏幕。将一条记录及所有关联记录从源数据库复制到目标数据库。\n\n## 步骤 1 — 选择连接\n\n源：要读取的数据库。\n目标：要写入的数据库。\n\n## 步骤 2 — 表和记录\n\n根表：记录所在的表。检测按钮：分析外键关系以建议最可能的根表。\n\n## 步骤 3 — 选项\n\n关系深度：跟踪多少层关联表。从 3 开始。\n掩码个人信息：将个人数据替换为真实的虚假值。\n冲突时：目标已有数据时的处理方式。\n\n## 步骤 4 — 字段覆盖\n\n允许在克隆过程中更改特定列的值。\n\n## 预览按钮\n\n不写入任何内容的试运行。显示将复制哪些表和多少行。
help.topic.conflict-resolution.body=# 冲突解决\n\n当 RecordRelay 向已有数据的目标写入时，需要一个策略。"冲突时"下拉框提供四个选项。\n\n## 重新生成标识符（默认 — 推荐）\n\n为每条克隆记录分配新的主键并更新所有外键。\n\n何时使用：几乎总是。\n\n## 隔离命名空间\n\n将所有 ID 偏移到独立的数字范围。\n\n何时使用：多个团队成员需要在同一共享开发数据库中独立的测试数据集时。\n\n## 安全失败\n\n如果任何受影响的表已有记录，则在写入任何行之前中止。\n\n## 跳过已存在\n\n静默跳过主键已在目标中存在的记录。\nPostgreSQL：ON CONFLICT DO NOTHING；MySQL：INSERT IGNORE；SQLite：INSERT OR IGNORE。
help.topic.environments.body=# 环境\n\n环境是数据库连接的命名逻辑分组。示例：prod、staging、local、ci。\n\n使用 RecordRelay 不需要环境——它们是可选的。\n\n## 如何创建\n\n从侧边栏打开"环境"。点击"添加…"，给它一个名称和可选描述，然后点击"确定"。
help.topic.connections.body=# 连接\n\n连接是一组凭据和网络设置。克隆至少需要两个连接。\n\n## 添加连接\n\n点击"添加…"。填写：\n• 名称：简短标签\n• 类型：数据库引擎\n• 主机、端口、数据库\n• 用户名和密码\n\n## 测试连接\n\n选择一行并点击"测试连接"。
help.topic.discovery.body=# 发现\n\n允许浏览任何已连接数据库的表和列结构，无需编写查询。\n\n## 使用方法\n\n• 从下拉列表选择连接\n• 选择数据库\n• 选择表\n• 点击"检查列"\n\n右侧面板显示所有列：名称、数据类型、是否允许 NULL 以及是否为主键。
help.topic.monitor.body=# 监控 / 仪表板\n\n显示当前应用会话中发生的情况。\n\n## 克隆历史\n\n每行代表一次克隆操作：表、记录 ID、源、目标、传输记录数、持续时间和结果。\n\n## KPI 卡片\n\n顶部显示汇总计数器。\n\n## 连接健康\n\n下方面板用于 ping 所有配置的连接。点击"检查健康"。\n\n注意：历史记录仅在当前会话中保留。
help.topic.graph-view.body=# 图形视图\n\n将数据库中表之间的外键关系可视化为 ERD 风格图表。\n\n## 使用方法\n\n• 选择连接\n• 从下拉列表选择根表\n• 点击"发现"\n\n## 导航\n\n• 悬停在节点上：突出显示相关关系\n• 缩放：滑块、+/- 按钮或 Ctrl+滚轮\n• 适合屏幕：重置缩放\n\n## 边类型\n\n实线曲线 = 已确认的外键约束。\n虚线曲线 = 通过列命名模式检测到的启发式链接。
help.topic.migration-drift.body=# 迁移漂移\n\n比较两个数据库的架构（表和列结构）并报告差异。\n\n## 使用方法\n\n• 选择源连接和数据库\n• 选择目标连接和数据库\n• 点击"分析"\n\n差异类型：\n• 缺失表（红色）\n• 多余表（黄色）\n• 缺失列（红色）\n• 多余列（黄色）\n• 类型不匹配（蓝色）\n\n## SQL 补丁脚本\n\n生成 ALTER TABLE / CREATE TABLE 以使目标与源对齐。
help.topic.row-count-diff.body=# 行数差异\n\n比较两个数据库中每个表的行数。\n\n## 读取结果\n\n• 同步：两个数据库该表行数相同\n• 目标落后：目标行数少于源\n• 目标领先：目标行数多于源\n\n"差异"列显示确切差值。
help.topic.query-analyzer.body=# 查询分析器\n\n允许查询任何已连接的数据库。两种模式：\n\n## 流程模式（默认）\n\n可视化查询构建器。双击左侧面板中的表将其添加到画布。点击端口按钮开始 JOIN。勾选列以加入 SELECT。\n\n## SQL 模式\n\n手写查询的纯文本编辑器。
help.topic.connection-health.body=# 连接健康\n\nPing 所有已保存的连接并报告：\n• 状态：正常、降级或宕机\n• 延迟：往返时间（毫秒）\n• 详情：连接失败时的错误消息\n\n点击"全部测试"运行检查。
help.topic.masking-coverage.body=# 掩码覆盖\n\n扫描架构中可能包含个人信息的列，并显示哪些列受掩码规则保护。\n\n## 检测到的列类别\n\n• 电子邮件\n• 电话\n• 地址\n• IBAN\n• 国家 ID\n\n## 读取结果\n\n绿色 = 启用掩码个人信息克隆时该列将被掩码。\n红色 = 该列看起来像个人信息但未受保护。
help.topic.presets.body=# 克隆预设模板\n\n保存常用克隆配置，一键运行。\n\n## 保存模板\n\n填写表单：名称、连接、实体、深度。点击"保存模板"。\n\n## 运行模板\n\n从列表中选择已保存的模板，点击"立即运行"。
help.topic.scheduled-sync.body=# 计划同步\n\n定义自动按计划运行或手动触发的重复克隆任务。\n\n## 设置同步\n\n填写名称、实体、连接和深度。然后设置计划：\n• Cron 表达式：标准 5 字段 cron\n• 间隔（分钟）：每 N 分钟运行一次\n\n两者留空表示仅手动运行。\n\n## 手动运行\n\n从列表中选择同步并随时点击"立即运行"。
help.topic.faq.body=# 常见问题\n\n## 什么是深度？\n\n控制跟踪多少层关联表。从 3 开始。\n\n## 目标中的主键会怎样？\n\n使用默认的"重新生成标识符"策略，每条克隆记录都会获得新的主键。\n\n## 我可以在不覆盖数据的情况下克隆吗？\n\n可以。将"冲突时"设置为"跳过已存在"。\n\n## 什么是 .rrpkg 文件？\n\n包含所有克隆记录的可移植包文件（ZIP 存档）。\n\n## 掩码会修改源数据吗？\n\n不会。掩码只影响写入目标的数据。\n\n## 我可以跨不同数据库引擎克隆吗？\n\n可以，只要架构兼容。
