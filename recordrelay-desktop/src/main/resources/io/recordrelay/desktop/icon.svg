<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42A5F5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Subtle highlight overlay -->
  <rect width="256" height="128" rx="48" fill="url(#glow)"/>

  <!-- Left database cylinder -->
  <!-- Top ellipse cap -->
  <ellipse cx="74" cy="82" rx="36" ry="12" fill="white" opacity="0.95"/>
  <!-- Body -->
  <rect x="38" y="82" width="72" height="66" fill="white" opacity="0.55"/>
  <!-- Bottom ellipse cap -->
  <ellipse cx="74" cy="148" rx="36" ry="12" fill="white" opacity="0.95"/>
  <!-- Mid line detail -->
  <ellipse cx="74" cy="115" rx="36" ry="12" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>

  <!-- Right database cylinder -->
  <ellipse cx="182" cy="82" rx="36" ry="12" fill="white" opacity="0.95"/>
  <rect x="146" y="82" width="72" height="66" fill="white" opacity="0.55"/>
  <ellipse cx="182" cy="148" rx="36" ry="12" fill="white" opacity="0.95"/>
  <ellipse cx="182" cy="115" rx="36" ry="12" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>

  <!-- Transfer arrow — thick, centered -->
  <line x1="118" y1="115" x2="138" y2="115" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <polyline points="130,103 143,115 130,127" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "RR" text below -->
  <text x="128" y="206" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="46" fill="white" text-anchor="middle" opacity="0.92">RR</text>
</svg>
